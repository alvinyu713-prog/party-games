<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十六張・連線對戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Chivo+Mono:wght@400;700&display=swap">

<style>
  /* 手機上雙擊會觸發縮放，還會讓每一次點擊延遲 300ms 才送出。
     manipulation 保留捏合縮放，只關掉雙擊縮放。 */
  html{-webkit-text-size-adjust:100%;}
  body{touch-action:manipulation;}

  :root{
    --felt:#1c5347; --felt-2:#123a31; --felt-3:#0c2a23;
    --rail:#5d4023; --rail-hi:#7d5730;
    --gold:#d8b45a; --gold-dim:#9a7c33;
    --ivory:#f6efdd; --ivory-2:#e6dcc2; --ivory-edge:#c9bb98;
    --back:#2f7d5f; --back-2:#246049;
    --ink:#22201c; --blue:#1b3a5c; --red:#b3372c; --green:#2f7d4f;
    --silk:#eee7d6; --silk-dim:#9db3a8;
    --panel:#0f2b24; --panel-2:#16382f; --line:#27544a;
    --good:#5fb37a; --warn:#d9a441; --bad:#cf5b48;
    --shadow:0 14px 34px rgba(0,0,0,.45);
  --netok:#5fb37a; --netwait:#9db3a8;
  --ts:1;            /* 牌桌牌面縮放，由「牌面大小」滑桿控制 */
  --th:1;            /* 自己手牌的額外倍率，由「自己手牌」滑桿控制 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:10px;
    background:#08201b;
    background-image:radial-gradient(1200px 560px at 50% -8%, #16382f, #08201b 74%);
    color:var(--silk); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  .wrap{max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:9px;}
  header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  h1{margin:0; font-family:"Noto Serif TC",serif; font-weight:900; font-size:26px; color:var(--gold); letter-spacing:.06em;}
  h1 em{font-style:normal; font-size:13px; font-weight:400; color:var(--silk-dim); margin-left:10px; letter-spacing:.2em;}
  .hud{margin-left:auto; display:flex; gap:7px; flex-wrap:wrap;}
  .hud div{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:4px 11px; font-size:10.5px; color:var(--silk-dim);}
  .hud b{display:block; font-family:"Chivo Mono",monospace; font-size:15px; color:var(--silk); font-variant-numeric:tabular-nums;}
  .hud .g b{color:var(--gold);}

  .row{display:grid; grid-template-columns:minmax(0,1fr) 286px; gap:10px; align-items:start;}
  @media (max-width:1080px){ .row{grid-template-columns:minmax(0,1fr);} }

  /* 牌桌是固定尺寸排出來的，牌一放大就會超出螢幕高度。
     這一層負責把整張桌子等比縮到塞得進一屏，寧可縮小也不要讓人捲來捲去。 */
  .boardfit{display:flex; justify-content:center;}
  /* 自己的手牌刻意放在縮放區外面：牌桌可以為了塞進螢幕縮小，
     但自己要看的那十七張永遠維持全尺寸，這才是最常盯著的東西。 */
  .myzone{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 8px 4px; margin-top:6px;
    background:linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.05));
    border-radius:14px; border:1px solid rgba(216,180,90,.18);
  }
  .boardfit > .board{transform-origin:top center;}
  .board{
    position:relative; border-radius:16px; padding:12px;
    background:radial-gradient(880px 500px at 50% 40%, #28705f, var(--felt) 30%, var(--felt-2) 74%, var(--felt-3));
    border:9px solid var(--rail);
    box-shadow:var(--shadow), inset 0 0 0 2px rgba(216,180,90,.2), inset 0 4px 26px rgba(0,0,0,.45);
  }

  /* ---------- 牌 ---------- */
  .t{
    position:relative; display:inline-block; flex:none; border-radius:4px;
    background:linear-gradient(168deg,#fffaef 0%,var(--ivory) 46%,var(--ivory-2) 100%);
    border:1px solid var(--ivory-edge);
    box-shadow:0 2px 0 #b7a882, 0 3px 5px rgba(0,0,0,.4);
    overflow:hidden; user-select:none; vertical-align:top;
  }
  .t svg{display:block; width:100%; height:100%;}
  .t.back{
    background:linear-gradient(160deg,var(--back) 0%,var(--back-2) 100%);
    border-color:#1c4a39; box-shadow:0 2px 0 #163a2d, 0 3px 5px rgba(0,0,0,.4);
  }
  .t.back::after{content:""; position:absolute; inset:3px; border:1px solid rgba(255,255,255,.16); border-radius:3px;}
  .t.pick{cursor:pointer; transition:transform .1s, box-shadow .1s;}
  .t.pick:hover{transform:translateY(-9px); box-shadow:0 10px 14px rgba(0,0,0,.45);}
  .t.sel{transform:translateY(-13px); box-shadow:0 12px 16px rgba(0,0,0,.5), 0 0 0 2px var(--gold);}
  .t.just{box-shadow:0 2px 0 #b7a882, 0 3px 5px rgba(0,0,0,.4), 0 0 0 3px var(--gold), 0 0 18px rgba(216,180,90,.7);}
  /* 剛打出來的那張會一直脈動，掃一眼就知道最新的是哪張 */
  .pond .t.just{animation:justPulse 1.15s ease-in-out infinite;}
  @keyframes justPulse{
    0%,100%{box-shadow:0 2px 0 #b7a882, 0 3px 5px rgba(0,0,0,.4), 0 0 0 3px var(--gold), 0 0 14px rgba(216,180,90,.5);}
    50%{box-shadow:0 2px 0 #b7a882, 0 3px 5px rgba(0,0,0,.4), 0 0 0 5px var(--gold), 0 0 26px rgba(216,180,90,.95);}
  }
  @media (prefers-reduced-motion:reduce){ .pond .t.just{animation:none;} }
  .t.taken{opacity:.42; filter:saturate(.5);}
  .t.hint{box-shadow:0 2px 0 #b7a882, 0 3px 5px rgba(0,0,0,.4), 0 0 0 2px var(--good);}
  .t .mark{
    position:absolute; left:0; right:0; bottom:0; font-size:8.5px; line-height:1.6; text-align:center;
    background:rgba(20,18,14,.82); color:var(--gold); font-weight:700; letter-spacing:.04em;
  }
  .t.taken{opacity:.5; filter:saturate(.55);}
  .t.taken .mark{background:rgba(120,60,20,.9); color:#ffe0a8;}
  .t.h{width:calc(58px * var(--th)); height:calc(80px * var(--th));}
  .t.m{width:calc(40px * var(--ts)); height:calc(55px * var(--ts));}
  .t.s{width:calc(40px * var(--ts)); height:calc(55px * var(--ts)); box-shadow:0 2px 0 #b7a882, 0 4px 7px rgba(0,0,0,.5);}
  .t.xs{width:calc(21px * var(--ts)); height:calc(29px * var(--ts));}
  .t.side{width:44px; height:32px;}

  /* ---------- 桌面格局 ---------- */
  .grid{
    display:grid; gap:8px; align-items:center; justify-items:center;
    grid-template-columns:calc(200px * var(--ts)) minmax(0,1fr) calc(200px * var(--ts));
    grid-template-rows:auto auto auto;
  }
  .pond{
    display:grid; gap:4px; padding:7px; border-radius:10px;
    background:linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.06));
    border:1px solid rgba(216,180,90,.10);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.18);
    grid-template-columns:repeat(6, calc(40px * var(--ts)));
    height:calc(104px * var(--ts)); align-content:start; overflow-y:auto; overscroll-behavior:contain;
  }
  .pond.v{grid-template-columns:repeat(4, calc(40px * var(--ts))); height:calc(140px * var(--ts));}
  .pond::-webkit-scrollbar{width:6px;}
  .pond::-webkit-scrollbar-thumb{background:rgba(216,180,90,.3); border-radius:3px;}
  .pond.turn{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 20px rgba(216,180,90,.2);}
  .center{
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 16px;
    border-radius:12px; background:rgba(0,0,0,.3); border:1px solid rgba(216,180,90,.22);
    width:210px; justify-content:center;
  }
  .center .wind{font-family:"Noto Serif TC",serif; font-size:32px; font-weight:900; color:var(--gold); line-height:1;}
  .center .sub{font-size:11px; color:var(--silk-dim);}
  .center .left{font-family:"Chivo Mono",monospace; font-size:20px; color:var(--silk);}
  /* 牌河裡的牌再大也可能一閃而過，中央固定留一格顯示「剛剛打出的是什麼」，
     而且會一直留到下一張打出來為止，來不及看也不要緊。 */
  .center .lastout{
    margin-top:8px; padding-top:9px; border-top:1px dashed rgba(216,180,90,.3);
    display:flex; flex-direction:column; align-items:center; gap:4px; width:100%;
  }
  .center .lastout .cap{font-size:10.5px; letter-spacing:.12em; color:var(--silk-dim);}
  .center .lastout .t{width:calc(52px * var(--ts)) !important; height:calc(72px * var(--ts)) !important;}
  .center .lastout .nm{
    font-family:"Noto Serif TC",serif; font-size:16px; font-weight:900; color:var(--gold);
    letter-spacing:.06em; line-height:1.2;
  }
  .center .lastout .by{font-size:12px; color:var(--silk); font-weight:700;}
  .center .lastout .by i{font-style:normal; color:var(--gold);}

  .who{
    display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--silk-dim);
    background:rgba(0,0,0,.26); border:1px solid var(--line); border-radius:8px; padding:4px 9px;
  }
  .who.turn{border-color:var(--gold); color:var(--silk);}
  .who b{color:var(--silk); font-size:12.5px;}
  .who .pt{font-family:"Chivo Mono",monospace; color:var(--gold);}
  .who .dl{color:var(--warn); font-weight:700;}
  .melds{display:flex; gap:5px; flex-wrap:wrap; justify-content:center;}
  /* 疊太密會變成一條綠色長條看不出是牌，留 6px 讓每張的邊露出來 */
  .backs{display:flex; justify-content:center; flex-wrap:wrap; max-width:calc(200px * var(--ts));}
  .backs .t{margin-left:-6px; box-shadow:-1px 2px 4px rgba(0,0,0,.45);}
  .backs .t:first-child{margin-left:0;}
  .backs.wide{max-width:calc(420px * var(--ts));}
  .meld{display:flex; gap:1px; padding:2px; border-radius:5px; background:rgba(216,180,90,.1);}
  .flowers{display:flex; gap:2px; flex-wrap:wrap;}

  /* 注意：牌的類別是 .t，座位方位不能再用 t/l/r 當修飾詞，
     否則 class="seat t" 會同時吃到 .t 的牌面樣式（實測整個座位變成象牙色方塊）。 */
  .seat{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .seat.side-l,.seat.side-r{max-width:calc(200px * var(--ts));}
  /* 吃碰槓出現時這一條會從無到有，桌面就跟著跳。先把位子留好。 */
  .melds{min-height:calc(31px * var(--ts)); align-items:flex-start;}
  .seat .backs{min-height:calc(31px * var(--ts));}
  /* 花牌與副露是打到一半才長出來的。不預留位子的話，盤面高度一變，
     自動縮放就重算出不同倍率，整張桌子會跳 —— 就是「畫面忽大忽小」。 */
  .seat .flowers{min-height:calc(29px * var(--ts));}
  .seat{min-height:calc(150px * var(--ts));}

  .myhand{
    margin-top:12px; display:flex; align-items:flex-end; gap:5px; flex-wrap:wrap;
    justify-content:center; min-height:calc(86px * var(--th));
  }
  .myhand .gap{width:14px;}
  .mymelds{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:7px;
    min-height:calc(57px * var(--th));}

  .acts{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-top:10px; min-height:42px;}
  /* 吃碰槓胡只有幾秒可以按，擺在頁面最下面常常整個錯過。
     一有得按就浮到畫面中下方，想不看到都難。 */
  /* --kb：手機鍵盤的高度（由 visualViewport 算出來）。正在打字時視窗要浮在鍵盤上面，不能被蓋住。 */
  .acts.pop{
    position:fixed; left:50%; bottom:calc(clamp(14px,4vh,48px) + var(--kb, 0px)); transform:translateX(-50%);
    z-index:40; margin:0; padding:14px 20px; border-radius:18px;
    background:rgba(8,26,21,.94); border:2px solid var(--gold);
    box-shadow:0 18px 50px rgba(0,0,0,.7), 0 0 0 6px rgba(216,180,90,.14);
    animation:actsPop .28s cubic-bezier(.2,1.5,.4,1) both;
    max-width:min(94vw,760px);
  }
  @keyframes actsPop{from{opacity:0; transform:translateX(-50%) translateY(24px) scale(.9);}
                     to{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}}
  .acts.pop button.btn{font-size:17px; padding:12px 26px;}
  .acts.pop button.btn.win{font-size:19px; padding:12px 30px;}
  @media (prefers-reduced-motion:reduce){ .acts.pop{animation:none;} }
  button.btn{
    appearance:none; border:1px solid var(--line); background:var(--panel-2); color:var(--silk);
    border-radius:9px; padding:10px 20px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  }
  button.btn:hover:not(:disabled){background:var(--line);}
  button.btn.go{background:var(--gold); color:#241c08; border-color:var(--gold);}
  button.btn.go:hover:not(:disabled){background:#e8c76d;}
  button.btn.win{background:var(--red); border-color:var(--red); color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{50%{filter:brightness(1.28);}}
  button.btn:disabled{opacity:.3; cursor:not-allowed;}
  button.btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ button.btn.win{animation:none;} .t.pick{transition:none;} }

  .banner{
    position:absolute; inset:0; display:grid; place-items:center; border-radius:8px;
    background:rgba(6,20,16,.86); z-index:5; padding:18px; text-align:center;
  }
  .banner .box{max-width:560px; width:100%;}
  .banner h2{margin:0 0 6px; font-family:"Noto Serif TC",serif; font-size:30px; color:var(--gold);}
  .banner .tais{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:12px 0;}
  .banner .tais span{background:var(--panel-2); border:1px solid var(--line); border-radius:7px; padding:4px 10px; font-size:12px;}
  .banner .tais span b{color:var(--gold); margin-left:5px;}
  .banner .money{font-family:"Chivo Mono",monospace; font-size:14px; color:var(--silk); margin:8px 0 4px;}
  .banner .hand{display:flex; gap:3px; justify-content:center; flex-wrap:wrap; margin:10px 0;}

  /* ---------- 側欄 ---------- */
  .side{display:flex; flex-direction:column; gap:9px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 11px;}
  .card h3{margin:0 0 8px; font-size:10.5px; letter-spacing:.14em; color:var(--gold); font-weight:700;}
  .claimcd{display:flex; align-items:center; gap:8px; margin-left:6px; align-self:center;}
  /* 固定寬度：秒數每 0.1 秒一變，寬度跟著變的話整個置中的視窗會左右抖，手機上按鈕就按不到。 */
  .claimcd .t{font-size:12px; color:var(--silk-dim); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:6.8em;}
  .acts.pop.sent{opacity:.55;}
  .claimcd .t.hot{color:#ff9a76; font-weight:700;}
  .claimcd .bar{display:block; width:84px; height:6px; border-radius:99px;
    background:rgba(255,255,255,.14); overflow:hidden;}
  .claimcd .bar i{display:block; height:100%; background:var(--jade,#4c8f6a); transition:width .1s linear;}
  .prm{display:flex; align-items:center; gap:8px; padding:2px 0;}
  .prm label{width:80px; flex:none; font-size:11px; color:var(--silk-dim);}
  .prm input[type=range]{flex:1; min-width:0; height:15px; accent-color:var(--gold);}
  .prm output{width:50px; text-align:right; font-family:"Chivo Mono",monospace; font-size:10.5px;
               font-variant-numeric:tabular-nums; color:var(--silk);}
  .seg{display:flex; gap:4px; flex:1;}
  .seg button{flex:1; padding:5px 2px; font-size:10.5px; border-radius:7px; border:1px solid var(--line);
              background:var(--panel-2); color:var(--silk-dim); cursor:pointer; font-family:inherit;}
  .seg button[aria-pressed="true"]{background:var(--gold); color:#241c08; border-color:var(--gold);}
  .log{height:150px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:2px; font-size:11.5px; line-height:1.65;}
  .log div{padding:1px 0; border-bottom:1px dashed var(--line); color:var(--silk-dim);}
  .log b{color:var(--silk);}
  .tais-tbl{font-size:11px; line-height:1.85; color:var(--silk-dim); max-height:190px; overflow-y:auto;}
  .tais-tbl b{color:var(--silk);}
  .tais-tbl i{font-style:normal; color:var(--gold); font-family:"Chivo Mono",monospace;}
  .hintbox{font-size:11.5px; line-height:1.8; color:var(--silk-dim);}
  .hintbox b{color:var(--silk);}
  kbd{font-family:"Chivo Mono",monospace; font-size:10px; background:rgba(255,255,255,.1); border-radius:3px; padding:1px 5px;}

  /* ── 觸控裝置：把控制項加高到手指按得到的尺寸 ── */
  @media (pointer: coarse) {
    button, .seg button, select { min-height: 36px; }
    input[type="range"] { height: 28px; }
    input[type="text"], input[type="number"] { min-height: 36px; font-size: 16px; }
  }

  /* ── 桌機：側欄自己捲，不要把整頁撐長 ── */
  @media (min-width: 1000px) and (min-height: 640px) {
    .side {
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 3px;
    }
    .side::-webkit-scrollbar { width: 7px; }
    .side::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 4px; }
  }
  /* ── 連線面板 ── */
  .who .afk{color:var(--warn)!important; font-weight:700;}
  .netrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:7px;}
  .netrow input{
    flex:1; min-width:96px; font:inherit; font-size:13px; padding:5px 8px; border-radius:7px;
    border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--silk);
  }
  .netrow input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .netrow .mini{padding:5px 10px; font-size:12px; width:auto;}
  .netstat{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--silk-dim); margin-bottom:6px;}
  .netstat i{width:8px; height:8px; border-radius:50%; background:var(--netwait); font-style:normal; flex:none;}
  .netstat i.on{background:var(--netok); box-shadow:0 0 8px var(--netok);}
  .netstat i.host{background:var(--gold); box-shadow:0 0 8px var(--gold);}
  .seatlist{display:flex; flex-direction:column; gap:3px; margin:6px 0;}
  .seatlist div{display:flex; align-items:center; gap:6px; font-size:12px;
    padding:3px 7px; border-radius:7px; background:rgba(0,0,0,.18);}
  .seatlist .w{color:var(--gold); font-weight:700; flex:none; width:16px;}
  .seatlist .me{outline:1px solid var(--gold);}
  .seatlist .tag{margin-left:auto; font-size:10px; padding:1px 6px; border-radius:99px;
    background:rgba(216,180,90,.18); color:var(--gold);}
  .nethint{font-size:11.5px; line-height:1.7; color:var(--silk-dim);}
  .nethint b{color:var(--silk);}
  /* ── 吃碰槓胡的大字 ──
     蓋滿整個視窗置中，底下壓一層深色光暈把牌桌壓下去，
     不然金字疊在綠底牌桌上會糊成一片。全程不吃點擊。
     用 fixed 而不是 absolute：這一塊是 .board 的兄弟節點，
     absolute 會去找最近的已定位祖先，捲動之後就跑位。 */
  .shout{
    position:fixed; inset:0; z-index:60; pointer-events:none;
    display:grid; place-content:center; justify-items:center;
    gap:clamp(12px,2.4vw,28px);
    background:radial-gradient(closest-side at 50% 47%,
      rgba(3,14,11,.86), rgba(3,14,11,.62) 52%, rgba(3,14,11,0) 82%);
    animation:shoutBg .22s ease-out both;
  }
  .shout[hidden]{display:none;}
  @keyframes shoutBg{from{opacity:0;}to{opacity:1;}}
  .shout .w{
    font-family:"Noto Serif TC",serif; font-weight:900; line-height:.92;
    font-size:clamp(99px,23.4vw,306px); letter-spacing:.06em;
    color:var(--gold);

  /* ---------- 音訊節點 ---------- */
  let ctx = null, musicBus, sfxBus, duck, noiseBuf, unlocked = false;

    if (!ctx) {

      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }

      comp.threshold.value = -12; comp.ratio.value = 4; comp.connect(ctx.destination);

  const pos = STICK_POS[n];
  const body = pos.map(([x, y, h, rot], i) => {

    if (n === 6 && i === 0) c = "#b3372c";
    if (n === 8 && i % 2 === 1) c = "#b3372c";
    return stickG(x, y, h, c, rot);
  }).join("");
  return open + body + `</svg>`;
}

/* ==================================================================
   胡牌判定：DFS 拆牌＋快取
   ================================================================== */
const winCache = new Map();          // 規格裡說的查表：把拆解結果快取起來
const shCache = new Map();
let cacheHit = 0, cacheMiss = 0;
// Hand-Code：把 34 個張數（0~4）直接編成一個 34 字元的字串。
// 原本用 for 迴圈逐位串接，光組 key 就比拆牌本身還貴 —— 實測模擬一局要 1153ms。
const handCode = (c) => String.fromCharCode.apply(null, c);
function key34(c, sets, pair) {
  return handCode(c) + (sets * 2 + (pair ? 1 : 0));
}
// c 是張數陣列，需要湊出 sets 組面子 ＋（pairUsed 為 false 時）一對將
function dfsWin(c, sets, pairUsed) {
  const k = key34(c, sets, pairUsed);
  const hit = winCache.get(k);
  if (hit !== undefined) { cacheHit++; return hit; }
  cacheMiss++;
  let i = 0;
  while (i < 34 && !c[i]) i++;
  if (i === 34) { const r = sets === 0 && pairUsed; winCache.set(k, r); return r; }
  let ok = false;
  if (!pairUsed && c[i] >= 2) {
    c[i] -= 2; ok = dfsWin(c, sets, true); c[i] += 2;
  }
  if (!ok && c[i] >= 3 && sets > 0) {
    c[i] -= 3; ok = dfsWin(c, sets - 1, pairUsed); c[i] += 3;
  }
  if (!ok && sets > 0 && i < 27 && i % 9 <= 6 && c[i + 1] > 0 && c[i + 2] > 0) {
    c[i]--; c[i + 1]--; c[i + 2]--;
    ok = dfsWin(c, sets - 1, pairUsed);
    c[i]++; c[i + 1]++; c[i + 2]++;
  }
  winCache.set(k, ok);
  if (winCache.size > 400000) winCache.clear();     // Cache_Size_Limit
  return ok;
}
// 嚦咕嚦咕（八對半）：門清，8 個對子，允許一組四張當兩對
function isSevenPairsPlus(c, melds) {
  if (melds.length) return false;
  let c2 = 0, c4 = 0, other = 0;
  for (let i = 0; i < 34; i++) {
    if (c[i] === 2) c2++;
    else if (c[i] === 4) c4++;
    else if (c[i] !== 0) other++;
  }
  return other === 0 && c2 + c4 * 2 === 8;
}
// 手牌（含剛拿到的那張）能不能胡。melds 是已經吃碰槓的組數
function canWin(tiles, melds) {
  const c = toCounts(tiles);
  const need = 5 - melds.length;
  if (need < 0) return false;
  const total = tiles.filter((t) => t < 34).length;
  if (total !== need * 3 + 2) return false;
  if (isSevenPairsPlus(c, melds)) return true;
  return dfsWin(c, need, false);
}
// 聽哪些牌：逐一試 34 種
function waitsOf(tiles, melds) {
  const out = [];
  for (let t = 0; t < 34; t++) {
    const c = toCounts(tiles);
    if (c[t] >= 4) continue;
    if (canWin([...tiles, t], melds)) out.push(t);
  }
  return out;
}
/* 向聽數：最多能湊幾組面子＋搭子。5 組面子＋1 對將 → 基準 10 */
function shantenOf(tiles, melds) {
  const c = toCounts(tiles);
  const need = 5 - melds.length;
  // 整手快取：AI 每回合會對同一手牌問很多次，這一層命中率極高
  const outerKey = handCode(c) + need;
  const cached = shCache.get(outerKey);
  if (cached !== undefined) { cacheHit++; return cached; }
  cacheMiss++;
  let best = 99;
  const seen = new Map();
  function walk(i, sets, parts, pair) {
    if (sets + parts > need) return;
    const k = handCode(c) + i + (sets * 8 + parts) + (pair ? 1 : 0);
    if (seen.has(k)) return;
    seen.set(k, 1);
    if (i >= 34) {
      // 基準是 need*2（5 組面子 → 10）。用 need*2+1 的話聽牌會被算成 1 向，
      // AI 就永遠不知道自己聽了，實測聽牌手牌回報 1 向。
      const sh = need * 2 - 2 * sets - parts - (pair ? 1 : 0);
      if (sh < best) best = sh;
      return;
    }
    if (!c[i]) { walk(i + 1, sets, parts, pair); return; }
    // 刻子
    if (c[i] >= 3) { c[i] -= 3; walk(i, sets + 1, parts, pair); c[i] += 3; }
    // 順子
    if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
      c[i]--; c[i + 1]--; c[i + 2]--; walk(i, sets + 1, parts, pair); c[i]++; c[i + 1]++; c[i + 2]++;
    }
    // 對子：當將或當搭
    if (c[i] >= 2) {
      if (!pair) { c[i] -= 2; walk(i, sets, parts, true); c[i] += 2; }
      c[i] -= 2; walk(i, sets, parts + 1, pair); c[i] += 2;
    }
    // 兩面／嵌張搭子
    if (i < 27 && i % 9 <= 7 && c[i + 1]) { c[i]--; c[i + 1]--; walk(i, sets, parts + 1, pair); c[i]++; c[i + 1]++; }
    if (i < 27 && i % 9 <= 6 && c[i + 2]) { c[i]--; c[i + 2]--; walk(i, sets, parts + 1, pair); c[i]++; c[i + 2]++; }
    c[i]--; walk(i, sets, parts, pair); c[i]++;
  }
  walk(0, 0, 0, false);
  // 八對半也算一條路
  let pairs = 0, kinds = 0;
  for (let i = 0; i < 34; i++) { if (c[i] >= 2) pairs++; if (c[i]) kinds++; }
  if (!melds.length) best = Math.min(best, Math.max(0, 8 - pairs) + Math.max(0, 8 - kinds));
  const r = Math.max(0, best);
  shCache.set(outerKey, r);
  if (shCache.size > 200000) shCache.clear();      // Cache_Size_Limit
  return r;
}

/* ==================================================================
   台數
   ================================================================== */
const WINDS = ["東", "南", "西", "北"];
function scoreHand(ctx) {
  // ctx: { tiles, melds, flowers, seat, roundWind, seatWind, selfDraw, menqing,
  //        winTile, lastTile, byKong, robKong, dealer, streak, concealedKongs }
  const tais = [];
  const add = (n, v) => tais.push({ n, v });
  const c = toCounts(ctx.tiles);
  const all = [...ctx.tiles];
  for (const m of ctx.melds) all.push(...m.tiles);
  const allC = new Array(34).fill(0);
  for (const t of all) if (t < 34) allC[t]++;

  if (ctx.dealer) add("莊家", 1);
  if (ctx.streak > 0) add("連莊 " + ctx.streak, ctx.streak * 2);
  if (ctx.selfDraw) add("自摸", 1);
  const menqing = ctx.melds.every((m) => m.concealed);
  if (menqing && ctx.selfDraw) add("不求人（門清自摸）", 2);
  else if (menqing) add("門清", 1);
  if (!menqing && ctx.melds.every((m) => !m.concealed) && ctx.melds.length === 5) add("全求人", 2);

  // 花牌
  const fl = ctx.flowers || [];
  if (fl.length) add("花牌 ×" + fl.length, fl.length);
  const mine = fl.filter((f) => (f - 34) % 4 === ctx.seat);
  if (mine.length >= 1) add("正花 ×" + mine.length, mine.length);
  if (fl.filter((f) => f < 38).length === 4) add("花槓（春夏秋冬）", 2);
  if (fl.filter((f) => f >= 38).length === 4) add("花槓（梅蘭菊竹）", 2);

  // 字牌刻子
  const rw = 27 + ctx.roundWind, sw = 27 + ctx.seatWind;
  if (allC[rw] >= 3) add("圈風 " + WINDS[ctx.roundWind], 1);
  if (allC[sw] >= 3) add("門風 " + WINDS[ctx.seatWind], 1);
  const dragons = [31, 32, 33].filter((t) => allC[t] >= 3).length;
  const dragonPairs = [31, 32, 33].filter((t) => allC[t] === 2).length;
  if (dragons === 3) add("大三元", 8);
  else if (dragons === 2 && dragonPairs === 1) add("小三元", 4);
  else for (const t of [31, 32, 33]) if (allC[t] >= 3) add(HONOR[t - 27] + "（三元牌）", 1);
  const winds = [27, 28, 29, 30].filter((t) => allC[t] >= 3).length;
  const windPairs = [27, 28, 29, 30].filter((t) => allC[t] === 2).length;
  if (winds === 4) add("大四喜", 16);
  else if (winds === 3 && windPairs === 1) add("小四喜", 8);

  // 花色
  const suits = new Set();
  let hasHonor = false;
  for (let i = 0; i < 34; i++) if (allC[i]) { if (i >= 27) hasHonor = true; else suits.add(Math.floor(i / 9)); }
  if (suits.size === 0 && hasHonor) add("字一色", 16);
  else if (suits.size === 1 && !hasHonor) add("清一色", 8);
  else if (suits.size === 1 && hasHonor) add("混一色", 4);

  // 面子結構
  const parts = decompose(ctx.tiles, 5 - ctx.melds.length);
  const allSets = [...ctx.melds.map((m) => ({ kind: m.kind === "chow" ? "run" : "pung", concealed: m.concealed, tiles: m.tiles }))];
  if (parts) for (const p of parts.sets) allSets.push({ kind: p.kind, concealed: true, tiles: p.tiles });
  const pungs = allSets.filter((s) => s.kind === "pung");
  const runs = allSets.filter((s) => s.kind === "run");
  if (pungs.length === 5) add("碰碰胡", 4);
  const concealedPungs = pungs.filter((s) => s.concealed).length + (ctx.concealedKongs || 0);
  if (concealedPungs >= 5) add("五暗刻", 8);
  else if (concealedPungs === 4) add("四暗刻", 5);
  else if (concealedPungs === 3) add("三暗刻", 2);
  if (isSevenPairsPlus(c, ctx.melds)) add("嚦咕嚦咕（八對半）", 8);

  // 平胡：無字無花、門清、全順子、將不是圈門風、聽兩頭
  if (menqing && !hasHonor && runs.length === 5 && parts && parts.pair !== undefined) {
    const pairT = parts.pair;
    const notWind = pairT !== rw && pairT !== sw;
    if (notWind && isTwoSidedWait(ctx.tiles, ctx.melds, ctx.winTile)) add("平胡", 2);
  }

  if (ctx.byKong) add("槓上開花", 1);
  if (ctx.robKong) add("搶槓", 1);
  if (ctx.lastTile) add(ctx.selfDraw ? "海底撈月" : "河底撈魚", 1);
  if (ctx.heaven) add("天胡", 24);
  if (ctx.earth) add("地胡", 16);

  const total = tais.reduce((a, b) => a + b.v, 0);
  return { tais, total };
}
// 把手牌拆成 5 組面子＋1 對將，回傳其中一種拆法（用來判斷平胡等牌型）
function decompose(tiles, need) {
  const c = toCounts(tiles);
  const sets = [];
  let pair;
  function walk(sn, pairUsed) {
    let i = 0;
    while (i < 34 && !c[i]) i++;
    if (i === 34) return sn === 0 && pairUsed;
    if (!pairUsed && c[i] >= 2) {
      c[i] -= 2; if (walk(sn, true)) { pair = i; c[i] += 2; return true; } c[i] += 2;
    }
    if (c[i] >= 3 && sn > 0) {
      c[i] -= 3;
      if (walk(sn - 1, pairUsed)) { sets.push({ kind: "pung", tiles: [i, i, i] }); c[i] += 3; return true; }
      c[i] += 3;
    }
    if (sn > 0 && i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
      c[i]--; c[i + 1]--; c[i + 2]--;
      if (walk(sn - 1, pairUsed)) { sets.push({ kind: "run", tiles: [i, i + 1, i + 2] }); c[i]++; c[i + 1]++; c[i + 2]++; return true; }
      c[i]++; c[i + 1]++; c[i + 2]++;
    }
    return false;
  }
  return walk(need, false) ? { sets, pair } : null;
}
// 平胡的核心條件：最後聽的必須是兩頭（不是邊張、嵌張、單騎）
function isTwoSidedWait(tiles, melds, winTile) {
  const rest = tiles.slice();
  const k = rest.indexOf(winTile);
  if (k < 0) return false;
  rest.splice(k, 1);
  const w = waitsOf(rest, melds);
  if (w.length < 2) return false;                    // 單騎、嵌張、邊張都只聽一張
  // 兩頭：聽的兩張差 3，而且不是 1-4 / 6-9 這種邊張形（那其實是兩頭沒錯，邊張只聽一張）
  if (!isHonor(winTile)) {
    for (const a of w) for (const b of w) {
      if (a !== b && Math.abs(a - b) === 3 && Math.floor(a / 9) === Math.floor(b / 9) && a < 27) return true;
    }
  }
  return false;
}

  S.turn = seat;
  if (!S.wall.length) { drawGame(); return; }
  if (isDeal) {
    // 莊家開局直接進入打牌（已經 16 張，補摸第 17 張）
    S.drawn = S.wall.pop();
    if (S.drawn >= 34) { S.flowers[seat].push(S.drawn); S.drawn = S.wall.shift(); S.flowers[seat].sort((a,b)=>a-b); }
  } else {
    S.drawn = S.wall.pop();
    while (S.drawn >= 34) {
      S.flowers[seat].push(S.drawn); S.flowers[seat].sort((a, b) => a - b);
      log(`🌸 ${seatName(seat)} 補花 ${tileName(S.drawn)}`);
      if (!S.wall.length) { drawGame(); return; }
      S.drawn = S.wall.shift();
      S.byKong = true;
    }
  }
  S.phase = "discard";
  fire("draw", seat, {});
  render();
  if (!isAI(seat)) {
    // 自摸？暗槓？
    const opts = selfOptions(seat);
    if (opts.length) { S.pending = { seat, kind: "self", opts }; render(); }
    armAfk(seat);
  } else think(() => aiTurn(seat));
}
function selfOptions(seat) {
  const hand = [...S.hands[seat], S.drawn];
  const opts = [];
  if (canWin(hand, S.melds[seat])) opts.push({ type: "win" });
  const c = toCounts(hand);
  for (let t = 0; t < 34; t++) if (c[t] === 4) opts.push({ type: "ankong", tile: t });
  for (const m of S.melds[seat]) {
    if (m.kind === "pung" && hand.includes(m.tiles[0])) opts.push({ type: "addkong", tile: m.tiles[0] });
  }
  return opts;
}
function discard(seat, tile, fromDrawn) {
  const hand = S.hands[seat];
  if (fromDrawn) { /* 直接打掉摸進來的，手牌不動 */ }
  else {
    const k = hand.indexOf(tile);
    if (k < 0) return false;
    hand.splice(k, 1);
    // 吃碰之後是「不用摸牌直接打」，此時 S.drawn 是 null。
    // 舊版無條件 push(S.drawn)，會把 null 塞進手牌，牌數與判定全部跟著爛掉。
    if (S.drawn !== null && S.drawn !== undefined) hand.push(S.drawn);
  }
  S.drawn = null;
  sortHand(seat);
  S.ponds[seat].push({ t: tile, taken: null, won: undefined, tsumogiri: !!fromDrawn });
  S.history[seat].push(tile);
  S.tsumogiri[seat].push(!!fromDrawn);
  S.visible[tile]++;
  S.lastDiscard = tile; S.lastFrom = seat;
  S.byKong = false;
  fire("discard", seat, { tile });
  log(`${seat === 0 ? "🧑" : "🀫"} ${seatName(seat)} 打 <b>${tileName(tile)}</b>${fromDrawn ? "（摸打）" : ""}`);
  render();
  resolveClaims(tile, seat);
  return true;
}

/* ---------- 吃碰槓胡 ---------- */
function claimOptions(seat, tile, from) {
  if (seat === from) return [];
  const hand = S.hands[seat], c = toCounts(hand);
  const out = [];
  if (canWin([...hand, tile], S.melds[seat])) out.push({ type: "win", seat, tile, from });
  if (c[tile] >= 3) out.push({ type: "kong", seat, tile, from });
  if (c[tile] >= 2) out.push({ type: "pung", seat, tile, from });
  // 吃只能吃上家（上家 = (seat+3)%4 打出來的）
  if ((from + 1) % 4 === seat && tile < 27) {
    const n = tile % 9;
    const combos = [];
    if (n >= 2 && c[tile - 2] && c[tile - 1]) combos.push([tile - 2, tile - 1]);
    if (n >= 1 && n <= 7 && c[tile - 1] && c[tile + 1]) combos.push([tile - 1, tile + 1]);
    if (n <= 6 && c[tile + 1] && c[tile + 2]) combos.push([tile + 1, tile + 2]);
    for (const cb of combos) out.push({ type: "chow", seat, tile, from, with: cb });
  }
  return out;
}
function resolveClaims(tile, from) {
  const ai = [], need = {};
  for (let s = 0; s < 4; s++) {
    if (s === from) continue;
    const opts = claimOptions(s, tile, from);
    if (!opts.length) continue;
    if (!isAI(s)) { need[s] = opts; continue; }         // 真人自己決定
    const pick = aiClaim(s, opts, tile, from);
    if (pick) ai.push({ seat: s, pick });
  }
  if (!Object.keys(need).length) { finishClaims(ai, tile, from); return; }
  /* 連線之後可能同時有兩三個真人都能吃碰胡，所以不能像舊版那樣只記一個 pending。
     每一席各自回答，全部答完（或時間到）才一起結算優先權。 */
  armClaim({ tile, from, need, ai });
}
function armClaim(cfg) {
  S.claim = Object.assign({ got: {}, until: 0, timer: null }, cfg);
  S.phase = "claim";
  if (!FAST && OPT.claimMs > 0) {
    const g = gen;
    S.claim.until = Date.now() + OPT.claimMs;
    S.claim.timer = setTimeout(() => {
      if (g !== gen || !S.claim) return;
      for (const s of Object.keys(S.claim.need)) if (S.claim.got[s] === undefined) S.claim.got[s] = null;
      settleClaims();
    }, OPT.claimMs);
  }
  render();
}
function answerClaim(seat, pick) {
  if (!S.claim || S.claim.need[seat] === undefined || S.claim.got[seat] !== undefined) return;
  S.claim.got[seat] = pick || null;
  // 胡的優先權最高，有人喊胡就不必再等其他人慢慢想
  const hu = pick && pick.type === "win";
  const all = Object.keys(S.claim.need).every((s) => S.claim.got[s] !== undefined);
  if (hu || all) settleClaims(); else render();
}
function settleClaims() {
  const c = S.claim;
  if (!c) return;
  if (c.timer) clearTimeout(c.timer);
  S.claim = null;
  if (c.rob) {                                   // 搶槓：沒人搶，槓就繼續下去
    const pick = c.got[c.robBy];
    if (pick && pick.type === "win") { declareWin(c.robBy, c.tile, false, c.from, true); return; }
    sortHand(c.from); kongDraw(c.from); return;
  }
  const picks = [...c.ai];
  for (const s of Object.keys(c.got)) if (c.got[s]) picks.push({ seat: Number(s), pick: c.got[s] });
  finishClaims(picks, c.tile, c.from);
}

function takeClaim(opt) { stopClaimTick(); act({ kind: "claim", pick: opt }); }

function finishClaims(claims, tile, from) {

  claims.sort((a, b) => (PRIO[b.pick.type] - PRIO[a.pick.type]) ||
    (((a.seat - from + 4) % 4) - ((b.seat - from + 4) % 4)));
  const w = claims[0];
  const p = w.pick;
  // 牌河那張標記成被誰拿走，但不刪掉 —— 使用者要求打出去的牌不能消失
  const pond = S.ponds[from];
  if (p.type === "win") {
    // 胡的那張留在牌河，標成「胡」而不是變暗 —— 它沒有進副露，不能算被拿走
    if (pond.length) pond[pond.length - 1].won = w.seat;
    declareWin(w.seat, tile, false, from);
    return;
  }
  if (pond.length) pond[pond.length - 1].taken = w.seat;
  const hand = S.hands[w.seat];
  const take = (t, n) => { for (let k = 0; k < n; k++) { const i = hand.indexOf(t); if (i >= 0) hand.splice(i, 1); } };
  if (p.type === "pung") {
    take(tile, 2);
    S.melds[w.seat].push({ kind: "pung", tiles: [tile, tile, tile], from, concealed: false });
    S.visible[tile] += 2;
    fire("pung", w.seat, { tile, from });
    log(`🀄 <b>${seatName(w.seat)}</b> 碰 ${tileName(tile)}`);
  } else if (p.type === "kong") {
    take(tile, 3);
    S.melds[w.seat].push({ kind: "kong", tiles: [tile, tile, tile, tile], from, concealed: false });
    S.visible[tile] += 3;
    fire("kong", w.seat, { tile, from });
    log(`🀄 <b>${seatName(w.seat)}</b> 明槓 ${tileName(tile)}`);
    kongDraw(w.seat); return;

    for (const t of p.with) take(t, 1);
    const tiles = [...p.with, tile].sort((a, b) => a - b);
    S.melds[w.seat].push({ kind: "chow", tiles, from, concealed: false });
    for (const t of p.with) S.visible[t]++;

    log(`🀄 <b>${seatName(w.seat)}</b> 吃 ${tiles.map(tileName).join("")}`);

  S.turn = w.seat; S.phase = "discard"; S.drawn = null;
  render();

function kongDraw(seat) {

    S.flowers[seat].push(S.drawn); S.flowers[seat].sort((a, b) => a - b);
    if (!S.wall.length) { drawGame(); return; }
    S.drawn = S.wall.shift();
  }
  S.byKong = true;
  S.turn = seat; S.phase = "discard";
  render();
  if (!isAI(seat)) {
    const opts = selfOptions(seat);
    if (opts.length) { S.pending = { seat, kind: "self", opts }; render(); }

const handWithDrawn = (seat) =>

    ? [...S.hands[seat], S.drawn] : [...S.hands[seat]];
function doAnkong(seat, tile) {
  const hand = handWithDrawn(seat);
  const rest = [];
  let removed = 0;
  for (const t of hand) { if (t === tile && removed < 4) { removed++; continue; } rest.push(t); }
  S.hands[seat] = rest; S.drawn = null;
  S.melds[seat].push({ kind: "kong", tiles: [tile, tile, tile, tile], from: seat, concealed: true });
  S.visible[tile] = 4;
  fire("ankong", seat, { tile });
  log(`🀄 <b>${seatName(seat)}</b> 暗槓 ${tileName(tile)}`);
  sortHand(seat);

function doAddKong(seat, tile) {
  const hand = handWithDrawn(seat);
  const k = hand.indexOf(tile);
  if (k < 0) return;
  hand.splice(k, 1);
  S.hands[seat] = hand; S.drawn = null;
  const m = S.melds[seat].find((x) => x.kind === "pung" && x.tiles[0] === tile);
  if (m) { m.kind = "kong"; m.tiles = [tile, tile, tile, tile]; }
  S.visible[tile]++;
  fire("kong", seat, { tile, from: seat });
  log(`🀄 <b>${seatName(seat)}</b> 加槓 ${tileName(tile)}`);
  // 搶槓：別人正好胡這張
  for (let s = 0; s < 4; s++) {
    if (s === seat) continue;
    if (canWin([...S.hands[s], tile], S.melds[s])) {
      if (!isAI(s)) {
        armClaim({ tile, from: seat, ai: [], rob: true, robBy: s,
                   need: { [s]: [{ type: "win", seat: s, tile, from: seat, rob: true }] } });
        return;
      }
      declareWin(s, tile, false, seat, true); return;
    }

/* ---------- 結算 ---------- */
function declareWin(seat, tile, selfDraw, from, robKong) {
  S.over = true; S.phase = "over";
  const tiles = selfDraw ? [...S.hands[seat], tile] : [...S.hands[seat], tile];
  const menqing = S.melds[seat].every((m) => m.concealed);
  const concealedKongs = S.melds[seat].filter((m) => m.kind === "kong" && m.concealed).length;
  const ctx = {
    tiles, melds: S.melds[seat], flowers: S.flowers[seat], seat,
    roundWind: S.roundWind, seatWind: seatWind(seat), selfDraw, menqing,
    winTile: tile, lastTile: S.wall.length === 0, byKong: S.byKong && selfDraw,
    robKong: !!robKong, dealer: seat === S.dealer, streak: seat === S.dealer ? S.streak : 0,
    concealedKongs,
  };
  const sc = scoreHand(ctx);
  const amount = OPT.base + sc.total * OPT.tai;
  const rake = Math.round(amount * OPT.rake / 100);
  const net = amount - rake;
  const pay = [0, 0, 0, 0];
  if (selfDraw) {
    for (let i = 0; i < 4; i++) if (i !== seat) { pay[i] = -net; pay[seat] += net; }
  } else {
    pay[from] = -net; pay[seat] = net;
  }
  /* 籌碼直接加減，沒有下限 —— 輸到負的照樣繼續打，這就是麻將的記帳方式。
     JS 的安全整數到 9,007,199,254,740,991，實務上等同無限。 */
  for (let i = 0; i < 4; i++) S.scores[i] += pay[i];
  S.lastPay = pay.slice();
  S.result = { seat, tile, selfDraw, from, sc, amount, rake, net, pay, tiles: [...tiles].sort((a, b) => a - b) };
  fire(selfDraw ? "tsumo" : "hu", seat, { tile, tai: sc.total, from });
  log(`🏆 <b>${seatName(seat)}</b> ${selfDraw ? "自摸" : "胡 " + seatName(from) + " 的"} ${tileName(tile)}　` +
      `<b>${sc.total} 台</b>　${sc.tais.map((x) => x.n).join("、")}`);
  render();
}
function drawGame() {
  S.over = true; S.phase = "over";
  S.result = { draw: true };
  S.lastPay = [0, 0, 0, 0];
  fire("drawgame", -1, {});
  log("🌊 <b>流局</b>　牌摸完了，沒有人胡");
  render();
}
function nextHand() {
  const r = S.result;
  const dealerWon = r && !r.draw && r.seat === S.dealer;
  if (r && r.draw) S.streak++;
  else if (dealerWon) S.streak++;
  else { S.streak = 0; S.dealer = (S.dealer + 1) % 4; S.hand++; }
  if (S.hand > 4) { S.hand = 1; S.roundWind = (S.roundWind + 1) % 4; }
  const maxRounds = OPT.mode === 0 ? 0 : OPT.mode === 1 ? 1 : 4;
  if (maxRounds && S.roundWind >= maxRounds && S.hand === 1 && S.streak === 0) {
    log(`🎊 <b>全部打完</b>　最終分數：${S.scores.map((s, i) => seatName(i) + " " + s).join("　")}`);
  }
  newHand();
}

/* ==================================================================
   AI —— 進攻與防守

// 危險係數 0~100：越低越安全（規格的 Safety Level Ranking）
function dangerOf(tile, me) {
  let worst = 0;
  for (let s = 0; s < 4; s++) {
    if (s === me) continue;
    let d = 50;
    const vis = S.visible[tile];
    // 現張／跟打：那家自己打過就絕對安全
    if (S.history[s].includes(tile)) d = 0;
    // 四張全現：世上沒有這張了
    else if (vis >= 4) d = 0;
    else if (isHonor(tile)) {
      // 字牌：現越多越安全
      d = [58, 40, 18, 4][Math.min(3, vis)];
    } else {
      const n = tile % 9, base = tile - n;
      // 筋牌：對方打過 n±3 的話，兩頭聽就不可能聽這張
      const suji = (n >= 3 && S.history[s].includes(base + n - 3)) ||
                   (n <= 5 && S.history[s].includes(base + n + 3));
      // 壁：中間某張已現 4 張，兩頭搭就搭不起來
      const wall = (n >= 2 && S.visible[base + n - 2] >= 4) || (n <= 6 && S.visible[base + n + 2] >= 4);
      d = (n === 0 || n === 8) ? 26 : (n === 1 || n === 7) ? 34 : 46;
      if (suji) d -= 18;
      if (wall) d -= 10;
      d -= vis * 5;
    }
    // 對方的聽牌嫌疑度越高，同一張牌越危險
    d *= 0.55 + tenpaiSuspicion(s) * 0.9;
    // 副露看起來在做清一色的話，同花色特別危險
    const cs = meldSuitBias(s);
    if (cs >= 0 && tile < 27 && Math.floor(tile / 9) === cs) d *= 1.35;
    if (cs === 3 && isHonor(tile)) d *= 1.3;
    worst = Math.max(worst, d);
  }
  return Math.max(0, Math.min(100, worst));
}
// 聽牌嫌疑度 0~1：摸模打比例 ＋ 副露數 ＋ 後半局還在打生張
function tenpaiSuspicion(s) {
  const hist = S.history[s], tg = S.tsumogiri[s];
  if (!hist.length) return 0;
  const late = S.wall.length < 40 ? 1 : 0;
  const tgRate = tg.slice(-6).filter(Boolean).length / Math.max(1, Math.min(6, tg.length));
  const melds = S.melds[s].length;
  let live = 0;
  for (let i = Math.max(0, hist.length - 4); i < hist.length; i++) if (S.visible[hist[i]] <= 1) live++;
  const raw = tgRate * .5 + melds * .12 + (late ? live * .09 : 0) + Math.min(.25, hist.length / 60);
  return Math.max(0, Math.min(1, raw));
}
// 副露偏向哪個花色（0~2 萬筒條，3 字牌，-1 沒有偏向）
function meldSuitBias(s) {
  const m = S.melds[s];
  if (m.length < 2) return -1;
  const cnt = [0, 0, 0, 0];
  for (const x of m) { const t = x.tiles[0]; cnt[t >= 27 ? 3 : Math.floor(t / 9)]++; }
  const top = cnt.indexOf(Math.max(...cnt));
  return cnt[top] >= m.length - (top === 3 ? 1 : 0) && cnt[top] >= 2 ? top : -1;

// 打哪一張：把進攻（打完剩幾向聽）與防守（危險係數）加權
function chooseDiscard(seat) {
  const hand = [...S.hands[seat], S.drawn].filter((t) => t !== null && t !== undefined);
  const uniq = [...new Set(hand)];
  const myShanten = shantenOf(hand.slice(0, hand.length), S.melds[seat]);
  // 別人看起來很危險、自己又還很遠 → 轉防守
  const maxSus = Math.max(...[0, 1, 2, 3].filter((s) => s !== seat).map(tenpaiSuspicion));
  // 自己越接近聽牌，越不該縮。舊版只看對手嫌疑度，特級會從頭防守到尾，
  // 實測 120 局流局 54 局。加上「自己近了就衝」這一項之後降到合理範圍。
  const closeness = 1 - Math.min(1, myShanten / 5);          // 0 遠 ~ 1 已聽牌
  const defendMode = maxSus * AI.defense > (0.25 + closeness * 1.1) * AI.attack;
  let best = uniq[0], bestScore = -1e9;
  for (const t of uniq) {
    const rest = hand.slice();
    rest.splice(rest.indexOf(t), 1);
    const sh = shantenOf(rest, S.melds[seat]);
    const w = sh <= 0 ? waitsOf(rest, S.melds[seat]).reduce((a, x) => a + (4 - S.visible[x]), 0) : 0;
    const danger = dangerOf(t, seat);
    // 進攻分：向聽越小越好，聽牌時進張數越多越好
    let sc = -sh * 100 + w * 6;
    // 防守分
    sc -= danger * (defendMode ? 1.9 : 0.5) * Math.min(1.1, AI.defense + .25);
    // 初級不看危險、亂打
    if (AI.level === 0) sc = -sh * 100 + w * 4 + (rnd() - .5) * 60;
    else sc += (rnd() - .5) * (AI.level === 1 ? 12 : 4);
    if (sc > bestScore) { bestScore = sc; best = t; }
  }
  return { tile: best, defendMode, myShanten };
}
function aiTurn(seat) {
  if (S.over || S.turn !== seat) return;
  const hand = [...S.hands[seat], S.drawn];
  // 自摸
  if (canWin(hand, S.melds[seat])) { declareWin(seat, S.drawn, true, seat); return; }
  // 暗槓／加槓：手牌還很遠才槓，聽牌了就不亂動
  const c = toCounts(hand);
  const sh = shantenOf(hand, S.melds[seat]);
  if (sh > 0 || AI.level === 0) {
    for (let t = 0; t < 34; t++) {
      if (c[t] === 4 && rnd() < .8) { doAnkong(seat, t); return; }

    for (const m of S.melds[seat]) {
      if (m.kind === "pung" && hand.includes(m.tiles[0]) && rnd() < .7) { doAddKong(seat, m.tiles[0]); return; }

function aiClaim(seat, opts, tile, from) {

  // 防守中就少碰少吃，免得手牌被鎖死
  const sus = Math.max(...[0, 1, 2, 3].filter((s) => s !== seat).map(tenpaiSuspicion));
  // 自己快聽牌了就照常吃碰；只有自己還很遠才因為對手危險而縮手

    const rm = (t, n) => { for (let k = 0; k < n; k++) { const i = h2.indexOf(t); if (i >= 0) h2.splice(i, 1); } };
    const m2 = [...S.melds[seat]];
    if (o.type === "pung") { rm(tile, 2); m2.push({ kind: "pung", tiles: [tile, tile, tile], concealed: false }); }
    else if (o.type === "kong") { rm(tile, 3); m2.push({ kind: "kong", tiles: [tile, tile, tile, tile], concealed: false }); }
    else { for (const t of o.with) rm(t, 1); m2.push({ kind: "chow", tiles: [...o.with, tile], concealed: false }); }
    const shAfter = shantenOf(h2, m2);
    let gain = shBefore - shAfter;
    if (o.type === "chow") gain -= .35;                 // 吃會破壞門清
    if (defend) gain -= 1.2;
    if (AI.level === 0) gain += rnd() * 1.2;
    if (gain > bestGain) { bestGain = gain; best = o; }
  }
  return bestGain >= 1 ? best : null;
}

function bestDiscardHint() {
  if (!S.hands[ME].length) return null;
  const hand = [...S.hands[ME], S.drawn].filter((t) => t !== null);
  let best = null, bestSh = 99, bestW = -1;
  for (const t of new Set(hand)) {
    const rest = hand.slice(); rest.splice(rest.indexOf(t), 1);
    const sh = shantenOf(rest, S.melds[ME]);
    const w = sh <= 0 ? waitsOf(rest, S.melds[ME]).reduce((a, x) => a + (4 - S.visible[x]), 0) : 0;
    if (sh < bestSh || (sh === bestSh && w > bestW)) { bestSh = sh; bestW = w; best = t; }
  }
  return best;
}

/* ---------- 聽牌 ----------
   算「我在聽哪幾張」要用 3n+1 張的手牌。輪到自己、手上是 3n+2 張的時候，
   先照建議打掉一張再算，顯示的才是「這樣打之後會聽什麼」。 */
function waitInfo() {
  const meld = S.melds[ME].length * 3;
  let hand = [...S.hands[ME], S.drawn].filter((x) => x !== null && x !== undefined);
  if (!hand.length) return null;
  let toss = null;
  if ((hand.length + meld) % 3 === 2) {              // 多一張，先打掉建議的那張
    toss = bestDiscardHint();
    const i = hand.indexOf(toss);
    if (i >= 0) hand.splice(i, 1);
  }
  const sh = shantenOf(hand, S.melds[ME]);
  if (sh > 0) return { sh, toss, waits: [] };
  const held = toCounts(hand);
  const waits = waitsOf(hand, S.melds[ME]).map((tile) => ({
    tile,
    // 還有幾張活著：四張扣掉場上已現的，再扣掉自己手裡握的
    left: Math.max(0, 4 - S.visible[tile] - held[tile]),
  }));
  return { sh: 0, toss, waits };
}

NET.push = function () {

  for (const p of NET.roster) {
    if (p.peer === NET.peer) continue;
    const seat = S.seatPeer.indexOf(p.peer);
    if (seat < 0) {
      const w = JSON.stringify({ wait: 1, names: S.seatOf, logs: S.logs.slice(-12) });
      if (p._last !== w) { p._last = w; NET.send(p.peer, { t: "wait", names: S.seatOf, logs: S.logs.slice(-12) }); }
      continue;
    }
    const v = seatView(seat);
    const s = JSON.stringify(v);

/* ==================================================================
   音效與語音
   全部用 WebAudio 當場合成，沒有任何外部音檔 —— artifact 的 CSP 擋外部
   音訊，內嵌 data URI 又會讓檔案肥好幾 MB，合成是唯一划算的做法。
   語音報牌用瀏覽器內建的 speechSynthesis，講中文不需要下載語音包。
   ================================================================== */
const SFX = (() => {
  let AC = null, unlocked = false;
  function ctx() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = 0; } }
    if (AC && AC.state === "suspended") AC.resume();
    return AC || null;
  }
  // 瀏覽器一律要等使用者互動過才准出聲，所以第一次點擊時解鎖
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    ctx();
  }
  const vol = () => (OPT.sound ? Math.max(0, Math.min(1, OPT.vol)) : 0);
  function tone(type, f0, dur, amp, f1, delay) {
    if (gaMuted()) return;                     // 共用音訊開關也要開才出聲
    const a = ctx(); if (!a || !vol()) return;
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp * vol()), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, amp, cut, sweep, delay) {
    if (gaMuted()) return;
    const a = ctx(); if (!a || !vol()) return;
    const t0 = a.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(cut, t0);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, sweep), t0 + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(amp * vol(), t0);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0);
  }
  /* 牌撞桌面的聲音：一下短噪音（塑膠殼）＋一個低頻（桌板共鳴）。
     兩者疊起來才像麻將牌，單用哪一個都像在敲鍵盤。 */
  const clack = (v, delay) => { noise(0.045, 0.5 * v, 5200, 900, delay); tone("triangle", 210, 0.07, 0.22 * v, 90, delay); };
  const BANK = {
    click:  () => clack(1),
    draw:   () => { noise(0.03, 0.22, 3800, 1200); tone("sine", 320, 0.05, 0.08, 240); },
    myturn: () => { tone("sine", 660, 0.12, 0.14, 880); tone("sine", 990, 0.16, 0.10, 1180, 0.08); },
    chat:   () => { tone("sine", 880, 0.09, 0.16, 1100); tone("sine", 1320, 0.12, 0.12, 1500, 0.07); },
    chow:   () => { clack(1); tone("square", 440, 0.1, 0.12, 520, 0.05); tone("square", 587, 0.14, 0.12, 660, 0.13); },
    pung:   () => { clack(1.2); tone("square", 523, 0.1, 0.16, 560, 0.04); tone("square", 659, 0.1, 0.16, 700, 0.12);
                    tone("square", 784, 0.18, 0.18, 820, 0.2); },
    kong:   () => { clack(1.4); tone("sawtooth", 392, 0.12, 0.15, 420, 0.04); tone("sawtooth", 523, 0.12, 0.15, 560, 0.13);
                    tone("sawtooth", 659, 0.12, 0.15, 700, 0.22); tone("sine", 130, 0.34, 0.26, 70, 0.3); },
    hu:     () => { noise(0.5, 0.16, 9000, 2600);
                    [523, 659, 784, 1047, 1319].forEach((f, i) => tone("triangle", f, 0.34, 0.2, f * 1.01, i * 0.085));
                    tone("sine", 131, 0.7, 0.24, 110, 0.1); },
    drawgame: () => { tone("sine", 392, 0.45, 0.16, 180); tone("sine", 294, 0.6, 0.14, 130, 0.16); },
  };
  function play(k) {
    if (!OPT.sound) return;
    const f = BANK[k];
    if (f) { try { f(); } catch (e) {} }
  }
  /* 語音報牌。周星馳的原聲是電影素材，不能也拿不到，
     這裡用瀏覽器內建的中文語音合成，把音高語速拉高做出誇張的喊牌感。 */
  let voices = null;
  function pickVoice() {
    if (!window.speechSynthesis) return null;
    if (!voices || !voices.length) voices = window.speechSynthesis.getVoices();
    if (!voices || !voices.length) return null;
    return voices.find((v) => /zh[-_]?(TW|HK)/i.test(v.lang)) ||
           voices.find((v) => /^zh/i.test(v.lang)) || null;
  }
  function say(text, opt) {
    if (gaMuted()) return;
    if (!OPT.voice || !OPT.sound || !window.speechSynthesis || !text) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) u.voice = v;
      u.lang = (v && v.lang) || "zh-TW";
      u.rate = (opt && opt.rate) || 1.35;      // 講快一點才像喊的
      u.pitch = (opt && opt.pitch) || 1.5;     // 音高拉高，誇張一點
      u.volume = Math.max(0, Math.min(1, OPT.vol));
      window.speechSynthesis.cancel();          // 前一句還沒講完就蓋過去
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
  if (window.speechSynthesis) {
    try { window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); }; } catch (e) {}
  }
  /* ---------- 背景音樂 ----------
     一樣是當場合成。五聲音階（宮商角徵羽）配慢速琶音，聽起來輕快不吵，
     而且完全不佔檔案大小 —— 真的音樂檔動輒好幾 MB，CSP 也擋外部音訊。
     排程採「提前 0.3 秒排好」的做法，靠 AudioContext 的時間軸而不是
     setInterval 的觸發時間，分頁在背景被降頻時節奏才不會亂掉。 */
  let mGain = null, mTimer = null, mNext = 0, mStep = 0, mOn = false;
  const BPM = 82, EIGHTH = 60 / BPM / 2;
  const PENT = [0, 2, 4, 7, 9, 12, 14, 16];      // 五聲音階往上兩個八度
  const PROG = [0, -3, -5, -3];                  // 四小節的根音走向，繞回來很順
  const hz = (semi) => 261.63 * Math.pow(2, semi / 12);
  function mVoice(a, f, t0, dur, amp, type) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, amp), t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0004, t0 + dur);
    o.connect(g); g.connect(mGain);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }
  function mSchedule() {
    const a = ctx(); if (!a || !mGain) return;
    while (mNext < a.currentTime + 0.35) {
      const bar = Math.floor(mStep / 8) % PROG.length;
      const root = PROG[bar];
      if (mStep % 8 === 0) mVoice(a, hz(root - 12), mNext, 1.7, 0.2, "sine");        // 低音撐著
      if (mStep % 8 === 4) mVoice(a, hz(root - 5), mNext, 1.1, 0.12, "sine");
      if (mStep % 2 === 0) {                                                          // 主旋律
        const idx = (mStep * 3 + bar * 2) % PENT.length;
        mVoice(a, hz(root + PENT[idx]), mNext, 0.55, 0.12, "triangle");
      }
      if (mStep % 4 === 3) {                                                          // 上方點綴
        const idx = (mStep * 5 + bar) % PENT.length;
        mVoice(a, hz(root + PENT[idx] + 12), mNext, 0.32, 0.05, "sine");
      }
      mNext += EIGHTH; mStep++;
    }
  }
  function musicStart() {
    const a = ctx(); if (!a || mOn) return;
    mGain = a.createGain();
    mGain.gain.value = Math.max(0, Math.min(1, OPT.musicVol));
    mGain.connect(a.destination);
    mNext = a.currentTime + 0.15; mStep = 0; mOn = true;
    mTimer = setInterval(mSchedule, 60);
    mSchedule();
  }
  function musicStop() {
    if (mTimer) clearInterval(mTimer);
    mTimer = null; mOn = false;
    if (mGain) {
      const a = ctx();
      try {
        mGain.gain.setValueAtTime(mGain.gain.value, a.currentTime);
        mGain.gain.exponentialRampToValueAtTime(0.0002, a.currentTime + 0.35);
      } catch (e) {}
      const g = mGain; mGain = null;
      setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 600);
    }
  }
  // 設定改了就跟著走；音量可以即時調，不用重開
  function musicSync() {
    if (!unlocked) return;                    // 還沒互動過，瀏覽器不准出聲
    if (OPT.music && OPT.musicVol > 0 && !(window.GameAudio && !window.GameAudio.musicOn)) {   // 角落共用開關的音樂也要是開的
      if (!mOn) musicStart();
      else if (mGain) mGain.gain.value = Math.max(0, Math.min(1, OPT.musicVol));
    } else if (mOn) musicStop();
  }
  // 分頁切走就停，回來再開 —— 背景一直放會很擾人
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (mOn) musicStop(); }
    else musicSync();
  });
  function unlockAll() { unlock(); musicSync(); }
  addEventListener("gameaudiochange", musicSync);
  addEventListener("pointerdown", unlockAll, { once: true, capture: true });
  addEventListener("keydown", unlockAll, { once: true, capture: true });
  return { play, say, unlock: unlockAll, musicSync, musicPlaying: () => mOn, ctx };
})();

let shoutTimer = null;
function shout(word, who, kind, tile) {
  if (!OPT.shout) return;
  const el = $("shout");
  if (!el) return;
  if (shoutTimer) clearTimeout(shoutTimer);
  el.className = "shout " + (kind || "");
  el.hidden = false;
  el.innerHTML = "";
  const row = document.createElement("div");
  row.className = "row";
  const w = document.createElement("div");
  w.className = "w"; w.textContent = word;
  row.appendChild(w);
  // 那一張牌直接畫出來，用的是牌桌上同一套牌面
  if (tile !== undefined && tile !== null && tile >= 0) row.appendChild(tileEl(tile, { size: "h" }));
  el.appendChild(row);
  if (who) {
    const d = document.createElement("div");
    d.className = "who"; d.innerHTML = who;
    el.appendChild(d);
  }
  shoutTimer = setTimeout(() => {
    el.classList.add("out");
    shoutTimer = setTimeout(() => { el.hidden = true; el.className = "shout"; }, 300);
    // 之前 1.1 秒就收掉，實測「還沒看清楚就不見了」。拉長到吃碰 1.9 秒、胡 3 秒。
  }, kind === "hu" ? 3000 : 1900);
}

/* ---------- 事件流 ----------
   客端不跑規則，所以「誰碰了、誰胡了」不能靠本地邏輯判斷，
   由房主把事件寫進快照，每個人依序播放。編號只增不減，避免重播。 */
let evtSeq = 0, seenEvt = 0, evtReady = false;
function fire(k, seat, extra) {
  S.evt.push(Object.assign({ id: ++evtSeq, k, seat }, extra || {}));
  while (S.evt.length > 16) S.evt.shift();
}
const SHOUT_WORD = { chow: "吃", pung: "碰", kong: "槓", ankong: "槓", hu: "胡", tsumo: "自摸" };
const VOICE_WORD = { chow: "吃", pung: "碰！", kong: "槓！", ankong: "暗槓", hu: "胡啦！", tsumo: "自摸啦！" };
function playEvents() {
  if (!S.evt || !S.evt.length) return;
  if (!evtReady) {                       // 第一次載入不要把舊事件整串補播
    seenEvt = S.evt[S.evt.length - 1].id;
    evtReady = true;
    return;
  }
  for (const e of S.evt) {
    if (e.id <= seenEvt) continue;
    seenEvt = e.id;
    const who = seatName(e.seat);
    if (e.k === "discard") {
      SFX.play("click");
      // 每個人打的牌都念出來，不用一直盯著牌河
      if (OPT.sayTile && e.tile !== undefined && e.tile !== null) SFX.say(tileName(e.tile));
      continue;
    }
    if (e.k === "draw") {
      if (e.seat === ME) SFX.play("draw");
      if (S.wall && S.wall.length < 20) gaMood(0.6);   // 牌快摸完，氣氛緊一點
      continue;
    }
    // 自己放槍
    if (e.k === "hu" && e.from === ME && e.seat !== ME && OPT.sound) gaSfx("lose");
    if (e.k === "drawgame") { SFX.play("drawgame"); shout("流局", "沒有人胡", ""); continue; }
    if (SHOUT_WORD[e.k]) {
      const kind = (e.k === "hu" || e.k === "tsumo") ? "hu" : (e.k === "kong" || e.k === "ankong") ? "kong" : e.k === "chow" ? "chow" : "";
      SFX.play(e.k === "hu" || e.k === "tsumo" ? "hu" : e.k === "ankong" ? "kong" : e.k);
      /* 副標寫清楚「誰、吃碰了誰打的、哪一張」。
         只喊一個「碰」的話，旁邊三家根本不知道碰的是什麼牌。 */
      const tn = (e.tile !== undefined && e.tile !== null && e.tile >= 0) ? tileName(e.tile) : "";
      let sub2 = "<i>" + esc(who) + "</i>";
      if (e.k === "tsumo") sub2 += "　自摸 " + esc(tn);
      else if (e.k === "hu") sub2 += "　胡 " + esc(seatName(e.from)) + " 打的 <i>" + esc(tn) + "</i>";
      else if (e.k === "ankong") sub2 += "　暗槓 <i>" + esc(tn) + "</i>";
      else sub2 += "　" + SHOUT_WORD[e.k] + " " + esc(seatName(e.from)) + " 打的 <i>" + esc(tn) + "</i>";
      if (e.tai) sub2 += "　" + e.tai + " 台";
      shout(SHOUT_WORD[e.k], sub2, kind, e.tile);
      SFX.say(VOICE_WORD[e.k] + (tn ? " " + tn : ""));
    }
  }
}

/* ---------- 聊天 ----------
   內容一律當成純文字處理。牌局紀錄那一欄是用 innerHTML 畫的，

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const raw = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
  const s = Array.from(raw).slice(0, 60).join("");
  if (!s) return;
  const key = seat >= 0 ? "s" + seat : "w" + who;
  const now = Date.now();
  if (chatCD[key] && now - chatCD[key] < 500) return;     // 半秒內只收一則
  chatCD[key] = now;
  S.chat.push({ n: String(who || "玩家").slice(0, 8), t: s, s: seat });
  while (S.chat.length > 60) S.chat.shift();
  render();
}

/* 輸入框與按鈕只綁一次。每次重畫都重建的話，正在打的字會被清掉 ——
   炸彈超人的名字欄踩過同一個坑。 */
function bindChat() {
  const inp = $("chatin"), btn = $("chatsend"), q = $("quick");
  if (!inp || !btn) return;
  const send = () => {
    const v = inp.value.trim();
    if (!v) return;
    inp.value = "";
    act({ kind: "chat", text: v });
  };
  btn.onclick = send;
  // 注音／倉頡選字時按的 Enter 是在確認選字，不是送出（否則只打一半的字就被送出去、輸入框被清空）
  inp.onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); } };
  if (q) q.innerHTML = QUICK.map((x) => '<button type="button">' + esc(x) + "</button>").join("");
  if (q) q.querySelectorAll("button").forEach((b, i) => { b.onclick = () => act({ kind: "chat", text: QUICK[i] }); });

  /* 表情符號插在游標位置，不是無腦接在最後面 —— 打到一半想加表情才順手。 */
  const pal = $("emoji"), eb = $("emoBtn");
  if (pal && eb) {
    /* 插在游標位置，不是無腦接在最後面 —— 打到一半想加表情才順手。 */
    const insert = (ch) => {
      const a = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
      const z = inp.selectionEnd == null ? a : inp.selectionEnd;
      inp.value = inp.value.slice(0, a) + ch + inp.value.slice(z);
      inp.focus();
      const p = a + ch.length;
      try { inp.setSelectionRange(p, p); } catch (e2) {}
    };
    pal.innerHTML = "";
    for (const [name, list] of EMOJI_GROUPS) {
      const c = document.createElement("div"); c.className = "cat"; c.textContent = name;
      pal.appendChild(c);
      for (const ch of list) {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = ch; b.title = ch;
        b.onclick = () => insert(ch);
        pal.appendChild(b);
      }
    }
    const kc = document.createElement("div"); kc.className = "cat"; kc.textContent = "顏文字";
    pal.appendChild(kc);
    for (const ch of KAOMOJI) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "kao"; b.textContent = ch; b.title = ch;
      b.onclick = () => insert(ch);
      pal.appendChild(b);
    }
    eb.onclick = () => { pal.classList.toggle("on"); if (pal.classList.contains("on")) inp.focus(); };
  }
}

/* ---------- 所有「我要做什麼」都走這裡 ----------
   單機／房主直接執行，客端送給房主由房主裁決。 */
function act(a) {
  if (NET.mode === "guest") { NET.send && NET.send(NET.hostPeer, { t: "a", a }); return; }
  applyAction(ME, a);
}
function applyAction(seat, a) {
  if (!a || typeof a !== "object") return;
  if (a.kind === "chat") { pushChat(seat >= 0 ? seatName(seat) : a.who, a.text, seat); return; }
  if (a.kind === "away") { setAway(seat, !!a.on); return; }
  if (a.kind === "next") { if (S.over) nextHand(); return; }
  if (S.over) return;
  if (a.kind === "discard") {
    if (S.turn !== seat || S.phase !== "discard" || S.pending || S.claim) return;
    if (a.fromDrawn) { if (S.drawn === null || S.drawn !== a.tile) return; }
    else if (!S.hands[seat].includes(a.tile)) return;
    clearAfk();
    discard(seat, a.tile, !!a.fromDrawn);
  } else if (a.kind === "claim") {
    answerClaim(seat, a.pick);
  } else if (a.kind === "self") {
    if (!S.pending || S.pending.kind !== "self" || S.pending.seat !== seat) return;
    const o = a.opt || {};
    // 送上來的選項必須真的在清單裡，不能自己捏一個「我胡了」
    const ok = o.type === "none" || S.pending.opts.some((x) => x.type === o.type && x.tile === o.tile);
    if (!ok) return;
    clearAfk();
    S.pending = null;
    if (o.type === "win") declareWin(seat, S.drawn, true, seat);
    else if (o.type === "ankong") doAnkong(seat, o.tile);
    else if (o.type === "addkong") doAddKong(seat, o.tile);
    else { armAfk(seat); render(); }
  }
}

/* ---------- 代打 ----------
   中途有事離開（自己按暫離、關視窗、斷線），那一席就交給電腦接手，
   牌局不會卡在那裡等一個不會回來的人。人回來再收回去。 */
function setAway(seat, on) {
  if (S.away[seat] === on) return;
  S.away[seat] = on;
  S.seatAI[seat] = on;
  log(on ? '☕ <b>' + seatName(seat) + '</b> 暫離，這一席改由電腦代打'
         : '🙋 <b>' + seatName(seat) + '</b> 回來了，自己接手');
  if (on) resumeSeat(seat); else clearAfk();
  render();
}
// 代打接手的瞬間，如果正好輪到他、或正在等他回答吃碰，要立刻替他動作，否則整桌會卡住
function resumeSeat(seat) {
  if (!isAI(seat) || S.over) return;
  if (S.claim && S.claim.need[seat] !== undefined && S.claim.got[seat] === undefined) {
    answerClaim(seat, aiClaim(seat, S.claim.need[seat], S.claim.tile, S.claim.from));
    return;
  }
  if (S.pending && S.pending.kind === "self" && S.pending.seat === seat) {
    S.pending = null;
    think(() => { if (!S.over && S.turn === seat) aiTurn(seat); }, 400);
    return;
  }
  if (S.turn === seat && S.phase === "discard") {
    think(() => {
      if (S.over || S.turn !== seat) return;
      if (S.drawn === null || S.drawn === undefined) aiDiscardOnly(seat); else aiTurn(seat);
    }, 400);
  }
}
/* 太久沒動作就幫他打這一手。跟「代打」不一樣：只代這一手，他還是自己的座位。
   沒有這個的話，一個人去上廁所全桌就停在那裡。 */
let afkTimer = null;

function armAfk(seat) {
  clearAfk();
  if (NET.mode === "solo" || isAI(seat) || !OPT.afkMs) return;
  const g = gen;
  afkTimer = setTimeout(() => {
    if (g !== gen || S.over || S.turn !== seat || isAI(seat)) return;
    log('⏳ <b>' + seatName(seat) + '</b> 太久沒動作，這一手先由電腦代打');
    if (S.pending && S.pending.seat === seat) S.pending = null;
    if (S.drawn === null || S.drawn === undefined) aiDiscardOnly(seat); else aiTurn(seat);
  }, OPT.afkMs);
}

/* ---------- 座位指派 ---------- */
function syncSeats() {
  if (NET.mode !== "host") return;
  const ids = NET.roster.map((p) => p.peer);
  let changed = false;
  for (let s = 0; s < 4; s++) {
    const pe = S.seatPeer[s];
    if (!pe) continue;
    if (ids.includes(pe)) {                     // 回來了
      if (S.seatGone[s]) { S.seatGone[s] = 0; if (S.away[s]) setAway(s, false); changed = true; }
      const p = NET.roster.find((x) => x.peer === pe);
      if (p && p.name && S.seatOf[s] !== p.name) { S.seatOf[s] = p.name; changed = true; }
    } else if (!S.seatGone[s]) {                // 剛斷線
      S.seatGone[s] = Date.now();
      log('📴 <b>' + seatName(s) + '</b> 斷線了，改由電腦代打');
      S.away[s] = true; S.seatAI[s] = true;
      resumeSeat(s); changed = true;
    }
  }
  // 空位（或斷線超過 90 秒沒回來的位子）讓給還在等的人
  for (const p of NET.roster) {
    if (S.seatPeer.includes(p.peer)) continue;
    let s = S.seatPeer.indexOf(null);
    if (s < 0) s = S.seatGone.findIndex((g, i) => g && Date.now() - g > 90000);
    if (s < 0) break;                            // 位子滿了，先當旁觀
    S.seatPeer[s] = p.peer; S.seatOf[s] = p.name || "玩家";
    S.seatGone[s] = 0; S.away[s] = false; S.seatAI[s] = false;
    log('🪑 <b>' + S.seatOf[s] + '</b> 入座（' + WINDS[s] + '位）');
    changed = true;
  }
  /* 房主自己的 ME 也要跟著座位走。ME 只在客端套用快照時設定，
     從客端升上來的房主會繼續用舊快照的席次 —— 畫面轉錯邊、手牌對不上人。 */
  const mine = S.seatPeer.indexOf(NET.peer);
  if (mine >= 0 && ME !== mine) { ME = mine; changed = true; }
  if (changed) render();
}
/* ====================================================================
   語音：按住說話

   不經過伺服器。四個人彼此各連一條。單機版沒有連線，這一整段不會啟動。
   用 function 宣告與 var：牌桌第一次畫的時候這段可能還沒跑到，不能碰到還沒初始化的 const。

var VC = null, VC_BOUND = false;

  return p === NET.peer ? VC.talking : !!VC.talk[p];
}
function vSend(id, obj) { if (NET.send) NET.send(id, Object.assign({ t: "rtc" }, obj)); }

async function voiceJoin() {

  if (!vOnline()) return;
  V.on = true; V.micErr = ""; V.told = {};

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("no"), { name: "NoMedia" });

    mic.getAudioTracks().forEach((t) => { t.enabled = false; });      // 預設靜音，按住才開

    V.mic = mic;

function voiceLeave() {
  const V = VC; if (!V) return;

  for (const id of Object.keys(V.peers)) vClose(id);
  if (V.mic) V.mic.getTracks().forEach((t) => t.stop());
  V.mic = null; V.on = false; V.told = {}; V.micErr = ""; V.blocked = false;

function vPeer(id) {

  pc.onicecandidate = (e) => { if (e.candidate) vSend(id, { k: "ice", c: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }); };
  pc.ontrack = (e) => {
    if (!p.audio) { p.audio = new Audio(); p.audio.autoplay = true; p.audio.setAttribute("playsinline", ""); }
    p.audio.srcObject = (e.streams && e.streams[0]) || new MediaStream([e.track]);

    const s = pc.connectionState;
    p.state = s === "connected" ? "已連上" : s === "failed" ? "連不上" : s === "disconnected" ? "斷線中" : s === "closed" ? "已關閉" : "連線中";
    // 失敗就由發起的那邊重試一次（換一組網路路徑）
    if (s === "failed" && vInitiator(id) && !p.restarted) { p.restarted = true; vOffer(p, true); }

}
function vAttachMic(p) {

  p.tx = tx;

  if (tx.sender.track !== track) tx.sender.replaceTrack(track).catch(() => {});
}
async function vOffer(p, restart) {

    vAttachMic(p);
    const offer = await p.pc.createOffer(restart ? { iceRestart: true } : undefined);
    await p.pc.setLocalDescription(offer);
    vSend(p.id, { k: "sdp", d: { type: p.pc.localDescription.type, sdp: p.pc.localDescription.sdp } });
  } catch (e) { p.state = "連不上"; voiceUI(); }

async function voiceRecv(from, m) {
  const V = vState();
  if (m.k === "on") {
    V.inVoice[from] = true;
    if (V.on) {
      if (!m.re) { vSend(from, { k: "on", re: 1 }); V.told[from] = true; }
      if (vInitiator(from)) { const p = vPeer(from); if (!p.pc.remoteDescription && p.pc.signalingState === "stable") vOffer(p); }
      else vPeer(from);
    }
    voiceUI(); return;
  }
  if (m.k === "off") { V.inVoice[from] = false; V.talk[from] = false; vClose(from); voiceUI(); return; }
  if (m.k === "talk") { V.talk[from] = !!m.on; vPaintTalk(); return; }
  if (!V.on) return;
  if (m.k === "sdp" && m.d && m.d.sdp) {
    const p = vPeer(from), pc = p.pc;
    try {
      if (m.d.type === "offer") {
        if (pc.signalingState !== "stable") await pc.setLocalDescription({ type: "rollback" });
        await pc.setRemoteDescription(m.d);
        vAttachMic(p);
        await pc.setLocalDescription(await pc.createAnswer());
        vSend(from, { k: "sdp", d: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
      } else if (m.d.type === "answer") {
        if (pc.signalingState !== "have-local-offer") return;

    } catch (e) { p.state = "連不上"; voiceUI(); }
    return;

/* 按住說話：麥克風軌道一直連著，只切 enabled。放開就是完全靜音（送出去的是無聲）。 */
