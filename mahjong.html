                 [L, at(.65)], [Rx, at(.65)], [L, H - kb - 150 - s], [Rx, H - kb - 150 - s]];
  // 自己的手牌不論輪不輪到自己都不能蓋（沒輪到時牌上沒有 tabindex，光看可點的元素會漏掉）
  const hot = "button, input, select, textarea, a[href], [tabindex], .acts, #myzone .t, #game-audio-dock";
  const busy = ([x, y]) => [[x + 6, y + 6], [x + s - 6, y + 6], [x + 6, y + s - 6], [x + s - 6, y + s - 6], [x + s / 2, y + s / 2]]
    .some(([px, py]) => { const el = document.elementFromPoint(px, py); return !!(el && el !== fl && el.closest && el.closest(hot)); });
  fl.style.visibility = "hidden";                       // 量的時候先讓自己不擋住下面
  let pick = fl._spot;
  if (force || pick == null || pick < 0 || busy(spots[pick])) pick = spots.findIndex((p) => !busy(p));
  fl.style.visibility = "";
  fl._spot = pick;
  fl.classList.toggle("nospot", pick < 0);             // 沒有空位就先收起來，手牌下面那顆照樣能按
  if (pick < 0) return;
  fl.style.left = Math.round(spots[pick][0]) + "px";
  fl.style.top = Math.round(spots[pick][1]) + "px";
}
function voiceSync() {
  const card = $("voicecard");
  if (!card) return;
  voiceBind();
  const online = vOnline();
  card.hidden = !online;
  const V = VC;
  if (V) {
    const ids = new Set(online ? NET.roster.map((p) => p.peer) : []);
    for (const id of Object.keys(V.peers)) if (!ids.has(id)) vClose(id);
    for (const id of Object.keys(V.inVoice)) if (!ids.has(id)) { delete V.inVoice[id]; delete V.talk[id]; }
    for (const id of Object.keys(V.told)) if (!ids.has(id)) delete V.told[id];
    if (!online) { V.myPeer = null; if (V.talking) voiceTalk(false); }
    else if (V.on) {
      if (V.myPeer !== NET.peer) { V.myPeer = NET.peer; V.told = {}; }
      for (const id of ids) if (id !== NET.peer && !V.told[id]) { V.told[id] = true; vSend(id, { k: "on" }); }
    }
  }
  voiceUI();
}
function vPaintTalk() {
  document.querySelectorAll(".who[data-vseat]").forEach((el) => el.classList.toggle("talking", vTalkingSeat(+el.dataset.vseat)));
  document.querySelectorAll("#vlist .vr[data-vpeer]").forEach((el) => el.classList.toggle("talking", !!(VC && VC.talk[el.dataset.vpeer])));
  const on = !!(VC && VC.talking);
  for (const id of ["pttBtn", "pttBtn2", "pttFloat"]) { const b = $(id); if (b) b.classList.toggle("on", on); }
  for (const id of ["pttBtn", "pttBtn2"]) { const b = $(id); if (b) b.textContent = on ? "🎙 說話中…放開就靜音" : "🎙 按住說話"; }
}
function voiceUI() {
  const st = $("vstat"), jb = $("vJoin"), pb = $("pttBtn"), fl = $("pttFloat"), list = $("vlist"), hint = $("vhint");
  if (!st || !list) return;
  const V = VC, on = !!(V && V.on), mic = !!(V && V.mic);
  const others = V ? Object.keys(V.inVoice).filter((k) => V.inVoice[k]).length : 0;
  st.innerHTML = !on
    ? (others ? `有 <b>${others}</b> 人在語音裡。` : "") + "按「加入語音」跟同桌的人講話。<b>按住才會出聲</b>，放開就是靜音。"
    : mic ? `已加入語音（連你 ${others + 1} 人）。<b>按住下面的按鈕說話</b>，電腦也可以按住 V 鍵。`
    : `已加入語音（連你 ${others + 1} 人）。<b>${vEsc(V.micErr)}</b>`;
  if (jb) jb.textContent = on ? "離開語音" : "加入語音";
  if (pb) pb.hidden = !(on && mic);
  /* 手機不用進選單就能用語音：
     直拿 —— 手牌正下方，沒加入時是「加入語音」，加入後換成「按住說話」；
     橫拿 —— 右側工具列，「加入語音／離開語音」一顆，按住說話是下面那顆浮動鈕。 */
  const online = vOnline();
  const row = $("pttRow"); if (row) row.hidden = !online || (on && !mic);
  const j2 = $("vJoin2"); if (j2) j2.hidden = on;
  const p2 = $("pttBtn2"); if (p2) p2.hidden = !(on && mic);
  const mv = $("mlVoice");
  if (mv) {
    mv.hidden = !online;
    const html = on ? "🔇<small>離開語音</small>" : "🎙<small>加入語音</small>";
    if (mv.innerHTML !== html) mv.innerHTML = html;
    mv.classList.toggle("in", on);
    mv.setAttribute("aria-label", on ? "離開語音" : "加入語音");
  }
  if (fl) { const was = fl.hidden; fl.hidden = !(on && mic); if (was && !fl.hidden) vPlaceFloat(true); }
  if (hint) hint.hidden = !(V && V.blocked && on);
  const rows = NET.roster.filter((p) => p.peer !== NET.peer).map((p) => {
    const inv = !!(V && V.inVoice[p.peer]), pr = V && V.peers[p.peer];
    const stt = !inv ? ["沒開語音", ""] : !on ? ["在語音裡", "ok"]
      : pr ? [pr.state, pr.state === "已連上" ? "ok" : pr.state === "連不上" ? "bad" : ""] : ["連線中", ""];
    return { id: p.peer, name: p.name, stt, mute: !!(V && V.mute[p.peer]), vol: V && V.vol[p.peer] != null ? V.vol[p.peer] : 1, ctl: on && inv };
  });
  const sig = JSON.stringify(rows.map((r) => [r.id, r.name, r.stt, r.mute, r.ctl]));
  if (list.dataset.sig !== sig) {
    list.dataset.sig = sig;
    list.innerHTML = rows.length ? rows.map((r) =>
      `<div class="vr" data-vpeer="${vEsc(r.id)}"><span class="nm">${vEsc(r.name)}</span><span class="st ${r.stt[1]}">${r.stt[0]}</span>` +
      (r.ctl ? `<button class="btn mini vm" type="button" data-vmute="${vEsc(r.id)}">${r.mute ? "🔇 靜音中" : "🔊"}</button>` +
               `<input type="range" min="0" max="100" value="${Math.round(r.vol * 100)}" data-vvol="${vEsc(r.id)}" aria-label="${vEsc(r.name)} 的音量">`
             : "<span></span>") + "</div>").join("")
      : '<div class="nethint">同桌還沒有其他真人。</div>';
    list.querySelectorAll("[data-vmute]").forEach((b) => { b.onclick = () => { const id = b.dataset.vmute, W = vState(); W.mute[id] = !W.mute[id]; vApplyVol(id); voiceUI(); }; });
    list.querySelectorAll("[data-vvol]").forEach((r) => { r.oninput = () => { const id = r.dataset.vvol; vState().vol[id] = +r.value / 100; vApplyVol(id); }; });
  }
  vPaintTalk();
}

/* 收到別人的訊息。房主收動作，客端收畫面。 */
function netRecv(from, m) {
  if (!m || typeof m !== "object") return;
  if (m.t === "rtc") { voiceRecv(from, m); return; }     // 語音的連線握手，房主客端都要收
  if (m.t === "a") {
    if (NET.mode !== "host") return;
    const seat = S.seatPeer.indexOf(from);
    if (seat < 0) {
      // 沒座位的人不能動牌，但可以講話（在旁邊等的人總得能喊一聲）
      if (m.a && m.a.kind === "chat") {
        const p = NET.roster.find((x) => x.peer === from);
        applyAction(-1, { kind: "chat", text: m.a.text, who: (p && p.name) || "旁觀" });
      }
      return;
    }
    applyAction(seat, m.a);
  } else if (m.t === "v") {
    if (NET.mode !== "guest") return;
    NET.waiting = false;
    applyView(m.v);
    renderNet();
  } else if (m.t === "wait") {
    if (NET.mode !== "guest") return;
    NET.waiting = true;
    S.logs = m.logs || []; paintLog();
    renderNet();
  }
}
/* 換房主。原房主那台才有完整的暗牌，接手的人拿不到，只能重新開一局。
   第一次連上線就當房主是另一回事 —— 現在桌上這局本來就是自己發的，不用重開。 */
function onHostChange(wasHost) {
  if (NET.mode !== "host" || wasHost) return;
  /* 判斷依據是「有沒有當過客端」，不是「有沒有當過房主」。
     用後者的話，客端升上來時會走進「第一次」那條路：
     實測會把自己塞進座位 0（同時佔住兩個位子），而且不重新發牌，
     桌上留著的是一份看不到暗牌的假快照。 */
  if (!NET.everGuest) {
    S.seatPeer[0] = NET.peer; S.seatOf[0] = myName();
    S.seatAI[0] = false; S.away[0] = false; S.seatGone[0] = 0;
    log("👑 你是房主，由你這台負責洗牌、發牌與計算");
    syncSeats();
    return;
  }
  S.seatPeer = [null, null, null, null]; S.seatGone = [0, 0, 0, 0];
  S.seatAI = [false, true, true, true]; S.away = [false, false, false, false];
  S.seatOf = [myName(), "下家", "對家", "上家"];
  S.seatPeer[0] = NET.peer;
  log("👑 原房主離線，改由你這台負責發牌與計算");
  log("♻️ 上一位房主的暗牌帶不過來，重新開一局");
  S.scores = [OPT.chips0, OPT.chips0, OPT.chips0, OPT.chips0]; S.lastPay = null;
  S.dealer = 0; S.roundWind = 0; S.hand = 1; S.streak = 0;
  syncSeats();
  newHand();
}

/* ---------- 連線面板 ---------- */
function renderNet() {
  voiceSync();                             // 名單一變，語音連線跟著增減
  if (mlChatPlace()) layoutSync();         // 手機橫拿時連上／斷線：聊天欄出現或收起，牌面倍率要重算
  const box = $("netbox");
  if (!box) return;
  const mySeat = NET.mode === "solo" ? 0 : S.seatPeer.indexOf(NET.peer);
  const dot = NET.mode === "host" ? "host" : NET.mode === "guest" ? "on" : "";
  const online = NET.roster.length;
  const stat = NET.mode === "solo"
    ? (NET.boot ? "單機（還沒連上）" : "單機模式")
    : NET.mode === "host" ? `房主・線上 ${online} 人` : `已連線・線上 ${online} 人`;

  const parts = [];
  parts.push(`<div class="netstat"><i class="${dot}"></i><span>${stat}</span></div>`);
  parts.push(`<div class="netrow">
      <input id="mjName" maxlength="8" value="${myName().replace(/"/g, "&quot;")}" placeholder="你的名字">
      <button class="btn mini" id="mjNameOk">改名</button>
    </div>`);

  if (NET.mode !== "solo") {
    const rows = [0, 1, 2, 3].map((s) => {
      const mine = s === mySeat;
      const who = S.seatOf[s] || "—";
      const tag = S.seatPeer[s] === null ? "電腦" : S.away[s] ? "代打中" : mine ? "你" : "線上";
      return `<div class="${mine ? "me" : ""}"><span class="w">${WINDS[s]}</span><span>${who}</span>` +
             `<span class="tag">${tag}</span></div>`;
    }).join("");
    parts.push(`<div class="seatlist">${rows}</div>`);
    if (mySeat >= 0) {
      parts.push(`<button class="btn" style="width:100%" id="mjAway">${S.away[mySeat] ? "我回來了，自己打" : "我有事，請電腦代打"}</button>`);
    } else {
      parts.push(`<div class="nethint">四個位子都滿了，你現在是<b>旁觀</b>。有人離開超過 90 秒就會輪到你。</div>`);
    }
  }
  if (NET.lobbyHTML) parts.push(NET.lobbyHTML());
  else parts.push('<div class="nethint" style="margin-top:8px">取個名字，你的座位就會掛上它。' +
    '這一版是單機，三家由電腦陪打。<br>要跟朋友一人一台連線同桌，用<b>自架伺服器版</b>' +
    '（資料夾 bomber-online，開 /mahjong.html）。</div>');
  box.innerHTML = parts.join("");

  const inp = $("mjName");
  if (inp) {
    const commit = () => setMyName(inp.value);
    $("mjNameOk").onclick = commit;
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } };
    inp.onblur = commit;
  }
  const aw = $("mjAway");
  if (aw) aw.onclick = () => act({ kind: "away", on: !S.away[mySeat] });
  NET.bindLobby && NET.bindLobby();
}

/* ====== 傳輸層開始（自架連線版） ====== */
/* WebSocket 直連自己的伺服器。誰都能進，不需要登入。
   房主那台跑規則，透過「指定對象傳送」一人給一份畫面，暗牌不會外流。 */
(function () {
  const q = new URLSearchParams(location.search);
  /* 沒指定房號就一律進同一桌 —— 跟炸彈超人一樣，大家開同一個網址就湊在一起。
     舊版是每個人一開就自動生一間自己的新房，等於逼使用者非得複製邀請連結
     才玩得起來，多了一道完全沒必要的手續。 */
  const TABLE = "MJ";                       // 公共桌
  const code = (q.get("r") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6) || TABLE;
  NET.code = code;
  NET.isTable = code === TABLE;

  /* 身分要能跨重連保住。每次連上都發新 id 的話，網路一抖在房主眼裡
     就變成另一個人：座位重配、手牌被當成別人的。 */
  let cid = "";
  try { cid = sessionStorage.getItem("mjcid") || ""; } catch (e) {}
  if (!cid) {
    cid = "m" + Math.random().toString(36).slice(2, 10);
    try { sessionStorage.setItem("mjcid", cid); } catch (e) {}
  }

  let ws = null, tries = 0;
  const wsURL = () => (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
    "/ws?g=mj&r=" + encodeURIComponent(code) + "&cid=" + encodeURIComponent(cid);

  NET.send = (to, obj) => {
    if (!ws || ws.readyState !== 1 || !to) return;
    try { ws.send(JSON.stringify({ t: "to", peer: to, d: obj })); } catch (e) {}
  };
  NET.announce = () => {
    /* 自己那份 presence 也要一起更新。只廣播給別人的話，
       下一次 syncSeats() 會拿自己的舊名字把座位表蓋回去 ——
       實測房主改了名，座位表還是顯示隨機的預設名。 */
    if (NET.peer && pres[NET.peer]) { pres[NET.peer].n = myName(); rebuild(); }
    if (!ws || ws.readyState !== 1) return;
    try { ws.send(JSON.stringify({ t: "p", d: { n: myName() } })); } catch (e) {}
  };

  const pres = {};
  function rebuild() {
    const list = Object.keys(pres).map((k) => ({
      peer: k, name: (pres[k] && pres[k].n) || "玩家", order: (pres[k] && pres[k]._o) || 0,
    }));
    list.sort((a, b) => a.order - b.order || (a.peer < b.peer ? -1 : 1));
    // 沿用舊的送出快取，名單一變就整包重送太浪費
    const old = new Map(NET.roster.map((p) => [p.peer, p._last]));
    for (const p of list) p._last = old.get(p.peer);
    NET.roster = list;
    const wasHost = NET.mode === "host";
    NET.hostPeer = list.length ? list[0].peer : null;
    NET.mode = !NET.peer ? "solo" : (NET.hostPeer === NET.peer ? "host" : "guest");
    if (NET.mode === "guest") NET.everGuest = true;
    if (NET.mode === "host") { syncSeats(); onHostChange(wasHost); }
    renderNet();
  }

  function connect() {
    try { ws = new WebSocket(wsURL()); } catch (e) { ws = null; return; }
    ws.onopen = () => { tries = 0; NET.announce(); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === "id") {
        NET.peer = m.peer;
        for (const k in pres) delete pres[k];
        pres[m.peer] = Object.assign({ n: myName() }, m.mine || {});
        for (const k in (m.all || {})) pres[k] = m.all[k];
        rebuild(); NET.announce();
      } else if (m.t === "d") {
        pres[m.peer] = Object.assign(pres[m.peer] || {}, m.d || {});
        rebuild();
      } else if (m.t === "bye") {
        delete pres[m.peer]; rebuild();
      } else if (m.t === "m") {
        netRecv(m.peer, m.d);
      } else if (m.t === "full") {
        NET.full = true; renderNet();
      }
    };
    ws.onclose = () => {
      ws = null; NET.peer = null; NET.mode = "solo"; NET.roster = [];
      renderNet();
      tries++; setTimeout(connect, Math.min(6000, 600 * tries));
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  NET.boot = connect;

  const newCode = () => "T" + Math.random().toString(36).slice(2, 6).toUpperCase();
  const linkOf = (c) => location.origin + location.pathname + (c === TABLE ? "" : "?r=" + c);
  const goRoom = (c) => {
    c = String(c || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    if (!c || c === NET.code) return;
    location.href = location.pathname + (c === TABLE ? "" : "?r=" + c);   // 換桌就整頁重連，最乾淨
  };
  NET.lobbyHTML = () => {
    const link = linkOf(NET.code);
    const head = NET.isTable
      ? '<div class="nethint" style="margin-top:9px"><b>公共桌</b>　' +
        (NET.full ? '<b style="color:var(--bad)">滿了，開一間私人桌吧</b>'
                  : '把這個網址傳給朋友，他們打開就跟你同一桌，不用輸入任何東西。') + '</div>'
      : '<div class="nethint" style="margin-top:9px">私人桌 <b>' + NET.code + '</b>　' +
        (NET.full ? '<b style="color:var(--bad)">這桌滿了</b>' : '把下面這行傳給朋友，他們打開就進這一桌。') + '</div>';
    return head +
      '<input class="netlink" id="mjLink" readonly value="' + link + '">' +
      '<button class="btn" style="width:100%;margin-top:5px" id="mjCopy">複製連結</button>' +
      (NET.isTable
        ? '<button class="btn" style="width:100%;margin-top:5px" id="mjNew">開一間私人桌</button>' +
          '<div class="nethint" style="margin-top:6px">不想跟陌生人同桌才需要開私人桌。' +
          '空著的位子一律由電腦先頂著，有人進來就接手。</div>'
        : '<button class="btn" style="width:100%;margin-top:5px" id="mjBack">回公共桌</button>' +
          '<div class="netrow" style="margin-top:9px">' +
          '<input id="mjRoom" maxlength="6" placeholder="換到別桌的代碼" style="text-transform:uppercase">' +
          '<button class="btn mini" id="mjJoin">前往</button></div>');
  };
  NET.bindLobby = () => {
    const c = document.getElementById("mjCopy"), i = document.getElementById("mjLink");
    if (c && i) c.onclick = () => {
      i.select();
      const done = () => { c.textContent = "已複製，貼給朋友就好"; setTimeout(() => { c.textContent = "複製連結"; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(i.value).then(done, () => { document.execCommand("copy"); done(); });
      else { document.execCommand("copy"); done(); }
    };
    const nb = document.getElementById("mjNew");
    if (nb) nb.onclick = () => goRoom(newCode());
    const bk = document.getElementById("mjBack");
    if (bk) bk.onclick = () => goRoom(TABLE);
    const rm = document.getElementById("mjRoom"), jb = document.getElementById("mjJoin");
    if (rm && jb) {
      jb.onclick = () => goRoom(rm.value);
      rm.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); goRoom(rm.value); } };
    }
  };
})();
/* ====== 傳輸層結束 ====== */

/* ---------- 啟動 ---------- */
drawParams();
applyScale();
applyLevel(1);
S.seatOf[0] = myName();
S.scores = [OPT.chips0, OPT.chips0, OPT.chips0, OPT.chips0];
newHand();
log("點手牌就打出去。右邊可以調底台、AI 難度與進攻防守權重。");
renderNet();
bindChat();
paintChat();
if (NET.boot) NET.boot();

/* ---------- 測試掛鉤 ---------- */
window.__m = {
  srand, rnd, S, OPT, AI, AI_LEVELS, applyLevel,
  tileName, toCounts, canWin, waitsOf, shantenOf, decompose, isSevenPairsPlus, isTwoSidedWait,
  scoreHand, dangerOf, tenpaiSuspicion, meldSuitBias, chooseDiscard,
  claimOptions, aiClaim, aiTurn, aiDiscardOnly, discard, newHand, nextHand,
  declareWin, drawGame, buildWall, render, selfOptions, takeClaim, passClaim,
  doAnkong, doAddKong, bestDiscardHint,
  cacheStats: () => ({ hit: cacheHit, miss: cacheMiss, size: winCache.size + shCache.size }),
  setFast: (v) => { FAST = v; },
  NET, act, applyAction, seatView, applyView, setAway, resumeSeat, syncSeats, netRecv,
  pushChat, paintChat, esc, QUICK, EMOJI, EMOJI_GROUPS, KAOMOJI, renderChips, renderTenpai, waitInfo, tryAutoWin, applyScale, fitBoard,
  SFX, shout, fire, playEvents, chatPing,
  answerClaim, settleClaims, armClaim, myName, setMyName,
  seatOfMe: () => ME, setMe: (v) => { ME = v; },
  seatWind, WINDS, HONOR, CN,
};
</script>
