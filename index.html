<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炸彈超人對戰（自架連線版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">

<style>
  html{-webkit-text-size-adjust:100%;}
  body{touch-action:manipulation;}

  :root{
    --bg:#12161d; --bg-2:#1a212b; --panel:#1d2733; --panel-2:#243040;
    --line:#33445a; --ink:#e9f0f8; --ink-2:#93a7bd;
    --hot:#ff6b4a; --gold:#ffc93c; --good:#4ade80; --bad:#f87171; --cy:#4cc0f0;
    --shadow:0 14px 34px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#e8ecf2; --bg-2:#dde3ec; --panel:#ffffff; --panel-2:#f2f6fa;
      --line:#d3dce7; --ink:#1a2330; --ink-2:#5e7085; --shadow:0 12px 26px rgba(40,60,90,.16);
    }
  }
  :root[data-theme="light"]{
    --bg:#e8ecf2; --bg-2:#dde3ec; --panel:#ffffff; --panel-2:#f2f6fa;
    --line:#d3dce7; --ink:#1a2330; --ink-2:#5e7085; --shadow:0 12px 26px rgba(40,60,90,.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg);
    background-image:radial-gradient(900px 460px at 50% -10%, var(--bg-2), var(--bg) 70%);
    color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    padding:12px;
  }
  .wrap{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:10px;}
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  h1{margin:0; font-family:"Bungee",sans-serif; font-size:20px; letter-spacing:.02em; color:var(--gold);}
  h1 span{font-family:"Noto Sans TC"; font-weight:900; color:var(--ink); margin-left:8px; font-size:17px;}
  .net{
    margin-left:auto; display:flex; align-items:center; gap:7px; font-size:11.5px;
    background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:5px 12px;
  }
  .dot{width:8px;height:8px;border-radius:50%; background:var(--ink-2);}
  .dot.on{background:var(--good); box-shadow:0 0 8px var(--good);}
  .dot.host{background:var(--gold); box-shadow:0 0 8px var(--gold);}

  .row{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:10px; align-items:start;}
  @media (max-width:940px){ .row{grid-template-columns:1fr;} }

  .stage{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px; box-shadow:var(--shadow);}
  canvas{display:block; width:100%; height:auto; aspect-ratio:15/14; border-radius:9px; background:#0d1117;}

  .hud{
    position:absolute; left:14px; right:14px; top:14px; z-index:3;
    display:flex; align-items:center; gap:10px; pointer-events:none;
  }
  .clock{
    font-family:"Bungee",monospace; font-size:20px; letter-spacing:.04em;
    background:rgba(12,16,22,.72); color:#fff; padding:3px 12px; border-radius:9px;
  }
  .clock.warn{color:#ff8f6b;}
  .mode{font-size:11.5px; background:rgba(12,16,22,.62); color:#dbe6f2; padding:4px 10px; border-radius:9px;}

  .curtain{
    position:absolute; inset:8px; z-index:5; border-radius:9px; overflow-y:auto;
    background:color-mix(in srgb, var(--panel) 95%, transparent);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:18px;
  }
  .curtain[hidden]{display:none;}
  .curtain h2{margin:0; font-size:20px; font-weight:900;}
  .curtain p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.8; text-align:center; max-width:46ch;}

  .lobby{width:100%; max-width:520px; display:flex; flex-direction:column; gap:9px;}
  .namerow{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .namerow label{font-size:12px; color:var(--ink-2); font-weight:700;}
  .namerow input{
    flex:1; min-width:120px; font:inherit; font-size:14px; padding:6px 9px; border-radius:8px;
    border:1px solid var(--line); background:rgba(12,16,22,.35); color:var(--ink);
  }
  .namerow input:focus{outline:2px solid #6fa8dc; outline-offset:1px;}
  .namerow .hint{font-size:11px; color:var(--ink-2); opacity:.8;}
  .lobbylist{border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:rgba(12,16,22,.28);}
  .lobbylist h4{margin:0 0 5px; font-size:11px; letter-spacing:.1em; color:var(--ink-2); font-weight:700;}
  .lp{display:flex; align-items:center; gap:6px; font-size:12.5px; padding:2px 0;}
  .lp.me b{color:#8fd0ff;}
  .tagh{font-size:10px; padding:1px 6px; border-radius:99px; background:#c9902f; color:#1a1409; font-weight:700;}
  .tagm{font-size:10px; padding:1px 6px; border-radius:99px; background:#3a6ea5; color:#eaf3ff;}
  .lobbyhow{font-size:11.5px !important; color:var(--ink-2); opacity:.9;}
  .roomrow{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .roomrow label{font-size:12px; color:var(--ink-2); font-weight:700;}
  .roomrow input{
    width:110px; font:inherit; font-size:15px; font-weight:700; letter-spacing:.18em;
    padding:5px 9px; border-radius:8px; text-transform:uppercase;
    border:1px solid var(--line); background:rgba(12,16,22,.35); color:var(--ink);
  }
  .roomrow button{font-size:12px; padding:5px 10px;}
  .hint2{font-size:11px; color:var(--ink-2); opacity:.85; margin-top:5px; line-height:1.6;}
  .diag{font-size:11.5px; line-height:1.75; padding:7px 9px; border-radius:8px; border:1px solid;}
  .diag.ok{border-color:#3f8a5a; background:rgba(63,138,90,.14); color:#a9e3bf;}
  .diag.warn{border-color:#a98a3c; background:rgba(169,138,60,.14); color:#f0d79a;}
  .diag.bad{border-color:#a3453a; background:rgba(163,69,58,.14); color:#f2b3aa;}
  .diag b{color:inherit; text-decoration:underline;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 11px; box-shadow:var(--shadow);}
  .card h3{margin:0 0 8px; font-size:11px; letter-spacing:.1em; color:var(--ink-2); font-weight:700;}
  .side{display:flex; flex-direction:column; gap:9px;}

  .plist{display:flex; flex-direction:column; gap:6px;}
  .pl{display:grid; grid-template-columns:26px 1fr auto; gap:8px; align-items:center;
      padding:6px 7px; border-radius:9px; background:var(--panel-2);}
  .pl.dead{opacity:.4;}
  .pl.me{outline:2px solid var(--gold);}
  .pl canvas{width:26px;height:26px; aspect-ratio:auto; background:none; border-radius:0;}
  .pl .nm{font-size:12.5px; font-weight:700; line-height:1.3;}
  .pl .st{font-size:10px; color:var(--ink-2);}
  .pl .wins{font-family:"Bungee",monospace; font-size:14px; color:var(--gold);}

  .stats{display:flex; gap:4px; flex-wrap:wrap; margin-top:3px;}
  .stats i{font-style:normal; font-size:9.5px; padding:1px 5px; border-radius:4px;
    background:color-mix(in srgb,var(--ink) 12%,transparent); color:var(--ink-2);}

  button{
    appearance:none; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
    border-radius:9px; padding:9px 10px; font-family:"Noto Sans TC",sans-serif; font-size:12.5px;
    font-weight:700; cursor:pointer; transition:transform .06s, background .12s;
  }
  button:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 18%,var(--panel-2));}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{opacity:.4; cursor:default;}
  button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  button.go{background:var(--gold); color:#231a03; border-color:transparent; font-size:14px; padding:11px 22px;
    font-family:"Bungee",sans-serif; letter-spacing:.04em;}

  .opts{display:flex; flex-direction:column; gap:7px; width:100%; max-width:430px;}
  .opt{display:grid; grid-template-columns:88px 1fr; gap:9px; align-items:center;}
  .opt > span{font-size:11.5px; color:var(--ink-2); text-align:right;}
  .seg{display:flex; gap:3px; flex-wrap:wrap;}
  .seg button{padding:5px 9px; font-size:11px; border-radius:7px;}
  .seg button[aria-pressed="true"]{background:var(--gold); color:#231a03; border-color:transparent;}

  .keys{display:grid; grid-template-columns:1fr 1fr; gap:3px 8px; font-size:11px; color:var(--ink-2);}
  kbd{font-family:"Bungee",monospace; font-size:9.5px; background:color-mix(in srgb,var(--ink) 13%,transparent);
    border-radius:4px; padding:1px 5px; margin-right:3px;}

  .pad{display:none; gap:6px; margin-top:8px;}
  .pad button{padding:14px 0; font-size:16px;}
  @media (pointer:coarse){ .pad{display:grid; grid-template-columns:repeat(3,1fr);} }
  .pad .sp{grid-column:1/-1; background:var(--hot); color:#fff; border-color:transparent;}

  .log{height:104px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:2px; font-size:11.5px; line-height:1.6;}
  .log div{padding:1px 0; border-bottom:1px dashed var(--line);}
  @media (prefers-reduced-motion:reduce){ button{transition:none;} }

  /* ── 觸控裝置：把控制項加高到手指按得到的尺寸 ── */
  @media (pointer: coarse) {
    button, .seg button, select { min-height: 36px; }
    input[type="range"] { height: 28px; }
    input[type="text"], input[type="number"] { min-height: 36px; font-size: 16px; }
  }

  /* ── 桌機：側欄自己捲，不要把整頁撐長 ── */
  @media (min-width: 1000px) and (min-height: 640px) {
    .side {
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 3px;
    }
    .side::-webkit-scrollbar { width: 7px; }
    .side::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 4px; }
  }

  /* ── 桌機：盤面限高在一屏內，整頁不出現捲軸 ── */
  @media (min-width: 941px) {
    /* max-height 只是保底，實際值由 fitCanvas() 量出來後覆寫。
       寫死 96px 的問題是：標題列一旦換行（名字長、人數多、視窗窄），
       預留的空間就不夠，整頁被撐高 → 使用者看到的「畫面往下掉、下半部不見」。 */
    #cv {
      width: auto; height: auto;
      max-width: 100%;
      max-height: calc(100vh - 96px);
      margin: 0 auto;
    }
    /* 側欄同樣跟著視窗縮。上面那條 sweep 規則要求視窗高 >= 640px，
       1024x600 這類矮視窗會整個失效，側欄就把頁面撐出捲軸。 */
    .side {
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 3px;
    }
  }
</style>

<div class="wrap">
  <header>
    <h1>BOMBER<span>炸彈超人對戰</span></h1>
    <div class="net"><span class="dot" id="netDot"></span><span id="netTxt">單機模式</span></div>
  </header>

  <div class="row">
    <div class="stage">
      <canvas id="cv" width="1440" height="1344"></canvas>
      <div class="hud">
        <span class="clock" id="clock">3:00</span>
        <span class="mode" id="modeTag">生存模式</span>
        <span class="mode" id="roundTag">第 1 局</span>
      </div>

    </div>

    <div class="side">
      <div class="card">
        <h3>你的名字</h3>

        <div class="hint2" id="nameHint">同場的人會看到這個名字</div>
      </div>

          <button data-d="ul">↖</button><button data-d="u">↑</button><button data-d="ur">↗</button>
          <button data-d="l">←</button><button data-d="x">■</button><button data-d="r">→</button>
          <button data-d="dl">↙</button><button data-d="d">↓</button><button data-d="dr">↘</button>

    </div>

</div>

<script>
/* ============================================================
   炸彈超人對戰
   連線：用 room 能力的 presence（不是 emit）。文件明載高頻狀態屬於
   presence，而且 presence 任何人都能設定，event topic 預設只有可編輯者
   能發。主機把整局快照放進自己的 presence，其他人把輸入放進自己的，
   誰都不需要額外權限。room 不可用時整頁照樣單機可玩。
   ============================================================ */
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const W = 15, H = 13, TS = 96;              // 邏輯格 96px，畫布 1440×1344（含上方 1 格 HUD 邊）
const VW = W * TS, VH = (H + 1) * TS;
ctx.scale(cv.width / VW, cv.width / VW);

/* ---------- 參數表 ---------- */
const EMPTY = 0, HARD = 1, SOFT = 2, PRESS = 3;      // 地圖格
const ITEMS = {
  bomb:   { n: "炸彈", c: "#2b3542", w: 20 },
  fire:   { n: "火力", c: "#ff6b4a", w: 20 },
  speed:  { n: "溜冰鞋", c: "#4cc0f0", w: 14 },
  kick:   { n: "踢炸彈", c: "#7ad07a", w: 6 },
  punch:  { n: "拳套", c: "#ffb347", w: 5 },
  throwx: { n: "拋摔", c: "#c58cf0", w: 5 },

  pierce: { n: "穿透", c: "#ffe14a", w: 4 },
  line:   { n: "連放", c: "#8fd6c8", w: 4 },
  heart:  { n: "生命", c: "#ff5d78", w: 3 },
  skull:  { n: "骷髏", c: "#dfe6ee", w: 9 },
};
const ITEM_KEYS = Object.keys(ITEMS);
const SKULLS = [
  { k: "auto",    n: "走火",   d: "移動時自動一直放炸彈" },
  { k: "nobomb",  n: "肚痛",   d: "完全無法放炸彈" },
  { k: "minfire", n: "極小火", d: "火力強制縮到 1 格" },
  { k: "hyper",   n: "狂躁",   d: "速度暴增到失控" },
  { k: "snail",   n: "龜速",   d: "速度掉到最低" },
  { k: "reverse", n: "混亂",   d: "方向鍵全部反轉" },
  { k: "short",   n: "早產",   d: "引信縮短到 1 秒" },
];
const COLORS = [
  { body: "#2f6fd0", limb: "#ffffff", ball: "#ff7fb0", name: "白超人" },
  { body: "#1c1f24", limb: "#ffffff", ball: "#ffd23c", name: "黑超人" },
  { body: "#d8342c", limb: "#ffffff", ball: "#ffd23c", name: "紅超人" },
  { body: "#3fb0e8", limb: "#ffffff", ball: "#ff7fb0", name: "藍超人" },
  { body: "#4fae3f", limb: "#ffffff", ball: "#ff9a3c", name: "綠超人" },
  { body: "#f2c53d", limb: "#ffffff", ball: "#2f6fd0", name: "黃超人" },
];
// 初速原本每秒只走 2.6 格，操作起來像在泥巴裡。經典作大約每秒 4 格起跳。
const SPEED_PX = [0, 4.6, 5.4, 6.2, 7.0, 7.8, 8.8, 9.8, 11.0];   // 速度等級 → 每幀格分之一
const FUSE = 2600, FUSE_SHORT = 1000, FIRE_MS = 520, SKULL_MS = 10000;

const OPT = {
  wins: 3, time: 180, com: 1, randomSpawn: 0, team: 0,
  sudden: "spiral", revenge: "on", skull: 1, carry: 0, mode: "survival", seats: 4, local: 1,
};

/* ---------- 狀態 ---------- */
let S = null, room = null, myPeer = null, isHost = true, peersCache = [];
let netMode = "solo";                        // solo | host | guest
let lastSnap = null, snapPrev = null, snapT = 0;
/* 兩次快照之間隔多久。用來把權威座標往前外推 —— 沒有這個就不知道
   「主機說的位置」到底落後多少，也就無法算出「現在應該在哪」。 */
let lastSnapAt = 0, snapGap = 100;
let matchOn = false;                         // 這一場是不是真的開打了
/* rx/ry 是「畫面座標」，跟主機給的權威座標 x/y 分開。
   自己的角色靠本地預測立刻動，其他人的靠補間平滑跟上。 */
/* 把權威座標依它自己的速度往前外推，得到「現在大概在哪」。
   主機給的位置天生落後一個來回：直接拿它對齊會邊走邊被往回拽，
   完全不對齊誤差又會一路累積到硬拉回為止 —— 兩種做法都會「飄」。
   外推量有上限，免得對方急停時衝過頭穿進牆裡。 */
function aheadOf(p) {
  const t = snapGap + 40;                                 // 一個快照間隔再加一點抖動
  let ox = (p.vpx || 0) * t, oy = (p.vpy || 0) * t;
  const m = Math.hypot(ox, oy), cap = 0.6;
  if (m > cap) { ox = ox / m * cap; oy = oy / m * cap; }
  return [p.x + ox, p.y + oy];
}
function guestSmooth(dt) {
  if (netMode !== "guest" || !S) return;
  const me = S.players.find((p) => p.peer && p.peer === myPeer);
  for (const p of S.players) {
    if (p.rx === undefined) { p.rx = p.x; p.ry = p.y; }
    if (p === me && p.alive && !p.cart) continue;         // 自己另外處理
    // 差太多（重生、被推車傳送）就直接跳，不要慢慢滑過去
    if (Math.abs(p.x - p.rx) > 1.5 || Math.abs(p.y - p.ry) > 1.5) { p.rx = p.x; p.ry = p.y; continue; }
    const [tx, ty] = aheadOf(p);
    const k = 1 - Math.pow(0.0015, dt / 1000);            // 約 60ms 收斂大半
    p.rx += (tx - p.rx) * k;
    p.ry += (ty - p.ry) * k;
  }
  if (!me || !me.alive || me.cart) { if (me) { me.rx = me.x; me.ry = me.y; } return; }
  // 自己的角色：拿本地輸入先走，手感就跟單機一樣即時
  const ghost = { ...me, x: me.rx, y: me.ry };
  movePlayer(S, ghost, myInput.dx, myInput.dy, dt);
  me.rx = ghost.x; me.ry = ghost.y; me.dir = ghost.dir;
  /* 對齊的目標是「外推後的權威座標」，不是落後的原始值，所以走路時
     也可以持續小幅修正而不會被往回拽。門檻從 1.2 格收到 0.65 格 ——
     實測舊設定會一路飄到 1.128 格才突然跳回去，那一跳就是使用者說的飄移。 */
  const [tx, ty] = aheadOf(me);
  const ex = tx - me.rx, ey = ty - me.ry;
  const err = Math.hypot(ex, ey);
  if (err > 0.65) { me.rx = tx; me.ry = ty; }
  else if (err > 0.01) {
    const moving = !!(myInput.dx || myInput.dy);
    const k2 = 1 - Math.pow(moving ? 0.25 : 0.02, dt / 1000);
    me.rx += ex * k2; me.ry += ey * k2;
  }
}
/* 量出畫布上方實際被佔掉多少，再決定它能有多高。
   標題列會不會換行、瀏覽器書籤列佔多少，都只有量了才知道。 */
function fitCanvas() {
  const cv = document.getElementById("cv");
  if (!cv) return;
  const stage = cv.parentElement;
  if (!stage) return;
  if (innerWidth < 941) { cv.style.maxHeight = ""; return; }   // 窄版是單欄，交給 CSS
  const r = stage.getBoundingClientRect();
  const cs = getComputedStyle(stage);
  const inner = parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0);
  const bodyPad = parseFloat(getComputedStyle(document.body).paddingBottom || 0);
  const room = innerHeight - r.top - inner - bodyPad - 4;
  cv.style.maxHeight = Math.max(220, Math.floor(room)) + "px";
}
let fitCvT = null;
addEventListener("resize", () => { clearTimeout(fitCvT); fitCvT = setTimeout(fitCanvas, 60); });
addEventListener("load", fitCanvas);
// 標題列的文字會隨人數與名字變動，變動後要重量一次
setInterval(fitCanvas, 1500);

// 主機／單機沒有延遲問題，畫面座標就是真值
function syncRender() {
  if (!S) return;
  for (const p of S.players) { p.rx = p.x; p.ry = p.y; }
}
let guestLive = false;                       // 客端看到的房主狀態

const now = () => performance.now();
const idx = (x, y) => y * W + x;
const rnd = (n) => Math.floor(Math.random() * n);
function log(t) {
  const el = $("log"), d = document.createElement("div");
  d.innerHTML = t; el.appendChild(d);
  while (el.childElementCount > 40) el.firstElementChild.remove();
}

function makeMap() {
  const m = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) m[idx(x, y)] = HARD;
    else if (x % 2 === 0 && y % 2 === 0) m[idx(x, y)] = HARD;
  }
  const corners = spawnCells();
  const safe = new Set();
  for (const c of corners) {
    safe.add(idx(c.x, c.y));
    for (const [dx, dy] of [[1,0],[0,1],[-1,0],[0,-1],[2,0],[0,2],[-2,0],[0,-2]]) {
      const x = c.x + dx, y = c.y + dy;
      if (x > 0 && y > 0 && x < W - 1 && y < H - 1) safe.add(idx(x, y));
    }
  }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = idx(x, y);
    if (m[i] === EMPTY && !safe.has(i) && Math.random() < .68) m[i] = SOFT;
  }
  return m;
}
function spawnCells() {
  return [{ x: 1, y: 1 }, { x: W - 2, y: H - 2 }, { x: W - 2, y: 1 }, { x: 1, y: H - 2 },
          { x: 1, y: (H - 1) >> 1 }, { x: W - 2, y: (H - 1) >> 1 }];
}
function rollItem() {
  const pool = [];
  for (const k of ITEM_KEYS) {
    if (k === "skull" && !OPT.skull) continue;
    for (let i = 0; i < ITEMS[k].w; i++) pool.push(k);
  }
  return Math.random() < .75 ? pool[rnd(pool.length)] : null;   // 44% 太低，後期會沒東西可撿
}

function newPlayer(i, seat, keep) {
  const c = spawnCells();
  const s = c[seat % c.length];
  const base = {
    id: i, seat, color: i, name: COLORS[i].name, isAI: false, peer: null, team: i % 2,
    x: s.x + .5, y: s.y + .5, dir: 2, alive: true, wins: 0, coins: 0,
    bombs: 1, fire: 2, speed: 3, kick: 0, punch: 0, throwx: 0, remote: 0, pierce: 0, line: 0, hearts: 0,
    skull: null, skullT: 0, invuln: 0, carry: null, cart: null, cartAng: 0, deadAt: 0,
    ai: { t: 0, tx: 0, ty: 0, plan: null },
  };
  if (keep) Object.assign(base, {
    bombs: keep.bombs, fire: keep.fire, speed: keep.speed, kick: keep.kick,
    punch: keep.punch, throwx: keep.throwx, remote: keep.remote, pierce: keep.pierce,
    line: keep.line, hearts: keep.hearts, wins: keep.wins, coins: keep.coins,
  });
  return base;
}

function newRound(keepStats) {
  // 一律以設定的人數為準。之前用 S.players.length，等於「開局後就再也改不了人數」，
  // 所以在選單改成 2 人還是會出現 4 個人。
  const seats = [0, 1, 2, 3, 4, 5].slice(0, Math.max(2, Math.min(6, OPT.seats)));
  if (OPT.randomSpawn) seats.sort(() => Math.random() - .5);
  const prev = S ? S.players : null;
  const players = seats.map((seat, i) =>
    newPlayer(i, seat, keepStats && prev && prev[i] ? prev[i] : (prev && prev[i] ? { wins: prev[i].wins, coins: prev[i].coins,
      bombs: 1, fire: 2, speed: 3, kick: 0, punch: 0, throwx: 0, remote: 0, pierce: 0, line: 0, hearts: 0 } : null)));
  if (prev) players.forEach((p, i) => { if (!prev[i]) return; p.isAI = prev[i].isAI; p.peer = prev[i].peer; p.name = prev[i].name; });
  return {
    map: makeMap(), items: new Int8Array(W * H).fill(-1), fire: new Float32Array(W * H),
    paint: new Int8Array(W * H).fill(-1), coins: new Int8Array(W * H), fireBy: new Int8Array(W * H).fill(-1), airT: 0,
    bombs: [], players, t: 0, left: OPT.time * 1000, round: (S ? S.round : 0) + 1,
    over: false, result: "", sudden: 0, spiral: null, fx: [],
  };
}

/* ============================================================
   模擬（只有主機跑）
   ============================================================ */
const solid = (m, x, y) => { const v = m[idx(x, y)]; return v === HARD || v === SOFT || v === PRESS; };
function bombAt(g, x, y) { return g.bombs.find((b) => Math.floor(b.x) === x && Math.floor(b.y) === y); }

const BODY = .34;
// 剛放下的炸彈要讓自己走得出去。判斷條件是「身體現在還有沒有碰到那一格」，
// 不能用「中心是不是在那一格」—— 中心一跨出格線、身體卻還壓著炸彈時，
// 炸彈會瞬間變成牆把自己封在爆炸範圍裡（實測電腦就是這樣被自己炸死的）。
function touching(p, cx, cy) {
  return p.x + BODY > cx && p.x - BODY < cx + 1 && p.y + BODY > cy && p.y - BODY < cy + 1;
}
function blocked(g, p, cx, cy) {
  if (cx < 0 || cy < 0 || cx >= W || cy >= H) return true;
  if (solid(g.map, cx, cy)) return true;
  const b = bombAt(g, cx, cy);
  if (b && !touching(p, cx, cy)) return true;
  return false;
}

function movePlayer(g, p, dx, dy, dt) {
  if (p.skull === "reverse") { dx = -dx; dy = -dy; }
  let lvl = p.speed;
  if (p.skull === "hyper") lvl = 8;
  if (p.skull === "snail") lvl = 1;
  const sp = SPEED_PX[Math.max(1, Math.min(8, lvl))] / TS * 60 * (dt / 1000) * TS / TS * 60 / 60;
  const step = SPEED_PX[Math.max(1, Math.min(8, lvl))] * (dt / 16.67) / TS;
  if (dx) p.dir = dx > 0 ? 1 : 3;
  else if (dy) p.dir = dy > 0 ? 2 : 0;

  const R = BODY;
  // 走道對齊：橫走時把 y 持續拉回格子中線（直走同理）。
  // 只在撞牆時才修正的話，走偏了就進不去側邊通道，手感會很黏。
  if (dx && !dy) {
    const cy = Math.floor(p.y) + .5, diff = cy - p.y;
    if (Math.abs(diff) > .01) p.y += Math.sign(diff) * Math.min(Math.abs(diff), step * 1.1);
  } else if (dy && !dx) {
    const cx2 = Math.floor(p.x) + .5, diff = cx2 - p.x;
    if (Math.abs(diff) > .01) p.x += Math.sign(diff) * Math.min(Math.abs(diff), step * 1.1);
  }
  const tryMove = (ax, ay) => {
    if (!ax && !ay) return false;
    const nx = p.x + ax * step, ny = p.y + ay * step;
    const cs = [[nx - R, ny - R], [nx + R, ny - R], [nx - R, ny + R], [nx + R, ny + R]];
    for (const [qx, qy] of cs) if (blocked(g, p, Math.floor(qx), Math.floor(qy))) return false;
    p.x = nx; p.y = ny; return true;
  };
  if (dx && dy) { tryMove(dx, 0); tryMove(0, dy); return; }
  if (tryMove(dx, dy)) return;
  // 轉角輔助：直走被擋時，往格中心對齊的方向滑一點
  if (dx) {
    const fy = p.y - Math.floor(p.y);
    const push = fy > .5 ? -1 : 1;
    if (Math.abs(fy - .5) > .12 && !blocked(g, p, Math.floor(p.x + dx * .6), Math.floor(p.y + push * .5))) tryMove(0, push);
  } else if (dy) {
    const fx = p.x - Math.floor(p.x);
    const push = fx > .5 ? -1 : 1;
    if (Math.abs(fx - .5) > .12 && !blocked(g, p, Math.floor(p.x + push * .5), Math.floor(p.y + dy * .6))) tryMove(push, 0);
  }
}

function placeBomb(g, p) {
  if (p.skull === "nobomb" || p.cart) return false;
  const own = g.bombs.filter((b) => b.o === p.id && !b.thrown).length;
  if (own >= p.bombs) return false;
  const x = Math.floor(p.x), y = Math.floor(p.y);
  if (bombAt(g, x, y)) return false;
  g.bombs.push({
    x: x + .5, y: y + .5, o: p.id, t: p.skull === "short" ? FUSE_SHORT : FUSE,
    r: p.skull === "minfire" ? 1 : p.fire, remote: p.remote > 0, pierce: p.pierce > 0,
    vx: 0, vy: 0, thrown: 0, tz: 0,
  });
  return true;
}

function explode(g, b, chain) {
  const cells = [], drops = [];
  const cx = Math.floor(b.x), cy = Math.floor(b.y);
  cells.push([cx, cy]);
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    for (let i = 1; i <= b.r; i++) {
      const x = cx + dx * i, y = cy + dy * i;
      if (x < 0 || y < 0 || x >= W || y >= H) break;
      const v = g.map[idx(x, y)];
      if (v === HARD || v === PRESS) break;
      if (v === SOFT) {
        g.map[idx(x, y)] = EMPTY;
        cells.push([x, y]);
        // 掉落物先記著，等火光那一輪跑完再放 —— 直接放的話會被同一發爆炸
        // 自己燒掉（實測掉落率只剩設定值的三成）。
        if (OPT.mode === "coin" && Math.random() < .5) drops.push([x, y, "$"]);
        else { const it = rollItem(); if (it) drops.push([x, y, it]); }
        if (!b.pierce) break; else continue;
      }
      cells.push([x, y]);
      const ob = bombAt(g, x, y);
      if (ob && ob !== b && !chain.has(ob)) { chain.add(ob); ob.t = 0; }
    }
  }
  for (const [x, y] of cells) {
    g.fire[idx(x, y)] = FIRE_MS;
    g.fireBy[idx(x, y)] = b.o;
    if (g.items[idx(x, y)] >= 0 && Math.random() < .7) g.items[idx(x, y)] = -1;   // 燒掉本來就躺在地上的
    if (OPT.mode === "paint") g.paint[idx(x, y)] = b.o;
  }
  for (const [x, y, k] of drops) {                       // 這一發炸出來的，不會被自己燒掉
    if (k === "$") g.coins[idx(x, y)] = 1 + rnd(3);
    else g.items[idx(x, y)] = ITEM_KEYS.indexOf(k);
  }
  g.fx.push({ x: cx, y: cy, t: 300 });
}

function hurt(g, p, byId) {
  if (!p.alive || p.invuln > 0 || p.cart) return;
  if (p.hearts > 0) { p.hearts--; p.invuln = 1200; log(`💗 ${nameOf(p)} 的心之生命擋下一次`); return; }
  p.alive = false; p.deadAt = g.t;
  log(`💥 ${nameOf(p)} 被炸掉了`);
  if (OPT.revenge !== "off") {
    p.cart = { side: p.id % 4, pos: Math.random(), t: 900 };
  }
  if (byId >= 0 && byId !== p.id) {
    const k = g.players[byId];
    if (k && k.cart && OPT.revenge === "super") {           // 復仇推車換位復活
      k.cart = null; k.alive = true; k.invuln = 1600;
      k.x = p.x; k.y = p.y;
      log(`♻️ ${nameOf(k)} 從推車換位復活`);
    }
  }
}
const nameOf = (p) => `<b style="color:${COLORS[p.color].body === '#1c1f24' ? '#9aa7b6' : COLORS[p.color].body}">${p.name}</b>`;

function pickup(g, p) {
  const i = idx(Math.floor(p.x), Math.floor(p.y));
  if (g.coins[i] > 0) { p.coins += g.coins[i]; g.coins[i] = 0; }
  const it = g.items[i];
  if (it < 0) return;
  g.items[i] = -1;
  const k = ITEM_KEYS[it];
  if (k === "bomb") p.bombs = Math.min(8, p.bombs + 1);
  else if (k === "fire") p.fire = Math.min(8, p.fire + 1);
  else if (k === "speed") p.speed = Math.min(8, p.speed + 1);
  else if (k === "heart") p.hearts = Math.min(1, p.hearts + 1);
  else if (k === "skull") {
    const s = SKULLS[rnd(SKULLS.length)];
    p.skull = s.k; p.skullT = SKULL_MS;
    log(`💀 ${nameOf(p)} 中了「${s.n}」—— ${s.d}`);
  } else p[k] = 1;
}

function stepSim(g, dt) {
  g.t += dt; g.left -= dt;
  // 驟死賽
  // 驟死賽在最後 60 秒開始，但短局要按比例縮短 —— 否則 60 秒的局從第一秒就在砸方塊
  const sdAt = Math.min(60000, OPT.time * 1000 * .4);
  if (OPT.sudden !== "off" && g.left <= sdAt && !g.sudden) {
    g.sudden = 1; g.spiral = { i: 0, t: 0, path: spiralPath() };
    log("⚠️ 驟死賽開始，壓力方塊開始掉落");
  }
  if (g.sudden && g.spiral) {
    g.spiral.t += dt;
    const every = Math.max(180, sdAt / Math.max(1, g.spiral.path.length));
    while (g.spiral.t > every && g.spiral.i < g.spiral.path.length) {
      g.spiral.t -= every;
      const c = g.spiral.path[g.spiral.i++];
      if (OPT.sudden === "random") {
        const free = [];
        for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++)
          if (g.map[idx(x, y)] !== HARD && g.map[idx(x, y)] !== PRESS) free.push([x, y]);
        if (!free.length) break;
        const [x, y] = free[rnd(free.length)];
        smash(g, x, y);
      } else smash(g, c[0], c[1]);
    }
  }
  // 後期空投：軟磚炸完之後就沒有道具來源，火力永遠停在 2 格、誰也殺不死誰。
  // 過了三分之一時間就每 10 秒空投一次，只投強化類，讓局勢往前推。
  g.airT += dt;
  if (g.airT > 10000 && g.t > OPT.time * 1000 * .33) {
    g.airT = 0;
    let soft = 0;
    for (let i = 0; i < W * H; i++) if (g.map[i] === SOFT) soft++;
    if (soft < 26) {
      const free = [];
      for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++)
        if (g.map[idx(x, y)] === EMPTY && g.items[idx(x, y)] < 0 && !bombAt(g, x, y)) free.push([x, y]);
      if (free.length) {
        const [x, y] = free[rnd(free.length)];
        // 拿掉「遙控」：遙控彈要另外按鍵引爆，操作變複雜而且會拖慢節奏
        const k = ["fire", "bomb", "fire", "bomb", "speed", "kick", "punch", "pierce", "heart", "fire"][rnd(10)];
        g.items[idx(x, y)] = ITEM_KEYS.indexOf(k);
        g.fx.push({ x, y, t: 400 });
        log(`🪂 空投補給：${ITEMS[k].n}`);
      }
    }
  }
  // 炸彈
  const chain = new Set();
  for (const b of g.bombs) {
    if (b.vx || b.vy) {                                    // 被踢動中
      const nx = b.x + b.vx * dt / 16.67, ny = b.y + b.vy * dt / 16.67;
      const tx = Math.floor(nx + Math.sign(b.vx) * .5), ty = Math.floor(ny + Math.sign(b.vy) * .5);
      if (solid(g.map, tx, ty) || (bombAt(g, tx, ty) && bombAt(g, tx, ty) !== b)) {
        b.vx = b.vy = 0; b.x = Math.floor(b.x) + .5; b.y = Math.floor(b.y) + .5;
      } else { b.x = nx; b.y = ny; }
    }
    if (b.thrown > 0) {                                    // 拋擲中
      b.thrown -= dt;
      b.x += b.tvx * dt / 16.67; b.y += b.tvy * dt / 16.67;
      b.tz = Math.sin((1 - b.thrown / b.thrownMax) * Math.PI) * .9;
      if (b.thrown <= 0) {
        b.tz = 0;
        let x = Math.max(1, Math.min(W - 2, Math.round(b.x - .5))), y = Math.max(1, Math.min(H - 2, Math.round(b.y - .5)));
        let guard = 0;
        while ((solid(g.map, x, y) || bombAt(g, x, y)) && guard++ < 20) { x = 1 + rnd(W - 2); y = 1 + rnd(H - 2); }
        b.x = x + .5; b.y = y + .5;
      }
    }
    // 遙控彈也要倒數，只是引信長很多。完全不倒數的話，玩家不知道要按 L、
    // 電腦又不會按，炸彈就永遠留在場上佔著上限（實際回報「有些炸彈不會爆」）。
    b.t -= b.remote ? dt * .28 : dt;
  }
  for (const b of g.bombs) if (b.t <= 0 && !chain.has(b)) chain.add(b);
  let guard = 0;
  while (chain.size && guard++ < 200) {
    const list = [...chain];
    chain.clear();
    for (const b of list) {
      if (b.done) continue;
      b.done = 1; explode(g, b, chain);
    }
  }
  g.bombs = g.bombs.filter((b) => !b.done);
  // 火光
  for (let i = 0; i < W * H; i++) if (g.fire[i] > 0) {
    g.fire[i] = Math.max(0, g.fire[i] - dt);
    if (g.fire[i] === 0) g.fireBy[i] = -1;      // 火熄了就清掉兇手，否則會拿過期資料判定死因
  }
  for (const f of g.fx) f.t -= dt;
  g.fx = g.fx.filter((f) => f.t > 0);

  // 玩家
  for (const p of g.players) {
    if (p.invuln > 0) p.invuln -= dt;
    if (p.skull) { p.skullT -= dt; if (p.skullT <= 0) p.skull = null; }
    if (p.cart) { stepCart(g, p, dt); continue; }
    if (!p.alive) continue;
    const inp = p.isAI ? aiInput(g, p, dt) : (p.input || { dx: 0, dy: 0 });
    // 先放炸彈再移動。順序反過來的話炸彈會被放在「逃跑路線的第一格」，
    // 火光正好沿著逃生方向追殺自己 —— 實測電腦三隻全部這樣自爆。
    if (inp.bomb) { if (placeBomb(g, p)) { inp.bomb = 0; if (p.isAI) p.ai.t = 0; } }
    if (inp.dx || inp.dy) {
      const before = Math.floor(p.x) + "," + Math.floor(p.y);
      movePlayer(g, p, inp.dx, inp.dy, dt);
      if (p.skull === "auto" && before !== Math.floor(p.x) + "," + Math.floor(p.y)) placeBomb(g, p);
      // 踢炸彈
      if (p.kick) {
        const fx = Math.floor(p.x + inp.dx * .55), fy = Math.floor(p.y + inp.dy * .55);
        const b = bombAt(g, fx, fy);
        if (b && !b.vx && !b.vy && (inp.dx || inp.dy)) { b.vx = inp.dx * .16; b.vy = inp.dy * .16; }
      }
    }
    if (inp.skill) {
      inp.skill = 0;
      const fx = Math.floor(p.x) + (p.dir === 1 ? 1 : p.dir === 3 ? -1 : 0);
      const fy = Math.floor(p.y) + (p.dir === 2 ? 1 : p.dir === 0 ? -1 : 0);
      const under = bombAt(g, Math.floor(p.x), Math.floor(p.y));
      const front = bombAt(g, fx, fy);
      if (p.throwx && under) {                             // 拋摔腳下的炸彈
        under.thrown = 420; under.thrownMax = 420;
        under.tvx = (p.dir === 1 ? 1 : p.dir === 3 ? -1 : 0) * 3 / (420 / 16.67);
        under.tvy = (p.dir === 2 ? 1 : p.dir === 0 ? -1 : 0) * 3 / (420 / 16.67);
      } else if (p.punch && front) {                       // 拳擊打飛前方炸彈
        front.thrown = 380; front.thrownMax = 380;
        front.tvx = (p.dir === 1 ? 1 : p.dir === 3 ? -1 : 0) * 3 / (380 / 16.67);
        front.tvy = (p.dir === 2 ? 1 : p.dir === 0 ? -1 : 0) * 3 / (380 / 16.67);
      } else if (p.line) {                                 // 連放：往面向方向排一直線
        const dx = p.dir === 1 ? 1 : p.dir === 3 ? -1 : 0, dy = p.dir === 2 ? 1 : p.dir === 0 ? -1 : 0;
        let n = p.bombs - g.bombs.filter((b) => b.o === p.id).length;
        for (let i = 1; i <= 6 && n > 0; i++) {
          const x = Math.floor(p.x) + dx * i, y = Math.floor(p.y) + dy * i;
          if (x <= 0 || y <= 0 || x >= W - 1 || y >= H - 1 || solid(g.map, x, y) || bombAt(g, x, y)) break;
          g.bombs.push({ x: x + .5, y: y + .5, o: p.id, t: FUSE, r: p.fire, remote: p.remote > 0, pierce: p.pierce > 0, vx: 0, vy: 0, thrown: 0, tz: 0 });
          n--;
        }
      }
    }
    if (inp.det) {
      inp.det = 0;
      for (const b of g.bombs) if (b.o === p.id && (b.vx || b.vy)) { b.vx = b.vy = 0; b.x = Math.floor(b.x) + .5; b.y = Math.floor(b.y) + .5; }
    }
    pickup(g, p);
    // 骷髏傳染
    if (p.skull) for (const q of g.players) {
      if (q === p || !q.alive || q.cart || q.skull) continue;

/* 名單重建會連帶觸發 syncSeats 與 renderLobby（整塊 DOM 重畫）。

   如果每個封包都重建一次，等於每秒上百次重繪 —— 那就是「非常非常慢」的來源。
   改法：presence 物件就地更新（peersCache 拿到的是同一個物件，永遠是新的），

      try { NET.ws.send(JSON.stringify({ t: "p", d: patch })); } catch {}

      NET.peers.set(NET.peer, NET.mine);
      emitPeers();

    renderLobby();

// 主機：把連上線的人指派到座位，其餘交給電腦
function syncSeats() {
  if (!S) return;
  const viewers = peersCache.filter((p) => p.kind === "viewer").map((p) => p.peer).sort();
  // 同機玩家先佔位，網路玩家從第 OPT.local 個座位起算，其餘交給電腦
  S.players.forEach((p, i) => {
    if (i < OPT.local) { p.peer = i === 0 ? myPeer : null; p.isAI = false; p.name = i === 0 ? myName() : "玩家 2"; return; }
    const peer = viewers.filter((v) => v !== myPeer)[i - OPT.local];
    p.peer = peer || null;
    p.isAI = !peer;
    if (peer) {
      const pr = peersCache.find((q) => q.peer === peer);
      p.name = (pr && typeof pr.presence.n === "string" ? pr.presence.n.slice(0, 8) : null) || COLORS[i].name;

function pullInputs() {
  if (netMode !== "host") return;
  for (const p of S.players) {
    if (!p.peer) continue;
    if (p.peer === myPeer) { p.input = myInput; continue; }
    const pr = peersCache.find((q) => q.peer === p.peer);
    const a = pr && Array.isArray(pr.presence.i) ? pr.presence.i : null;
    if (!a) { p.input = { dx: 0, dy: 0, bomb: 0, skill: 0, det: 0 }; continue; }
    // 第一次看到這個人就先對齊，免得把他連線前累積的次數一次全放出來
    const nb = a[2] | 0, nk = a[3] | 0;
    if (!p._seq || p._seq.peer !== p.peer) p._seq = { peer: p.peer, b: nb, k: nk, pb: 0, pk: 0 };
    // 對方重整或重連時計數會從頭開始。沒有這一段的話基準永遠比來源高，
    // 之後不管怎麼按都算不出增量 —— 就是「炸彈按不出來」。
    if (nb < p._seq.b || nk < p._seq.k) { p._seq.b = nb; p._seq.k = nk; p._seq.pb = 0; p._seq.pk = 0; }
    p._seq.pb = Math.min(2, p._seq.pb + Math.max(0, nb - p._seq.b));   // 積壓最多兩顆，免得事後亂放
    p._seq.pk = Math.min(2, p._seq.pk + Math.max(0, nk - p._seq.k));
    p._seq.b = nb; p._seq.k = nk;
    const fireB = p._seq.pb > 0, fireK = p._seq.pk > 0;
    if (fireB) p._seq.pb--;                    // 每幀消化一次，按太快也不會掉
    if (fireK) p._seq.pk--;

  }
}

// 十字火光：相鄰的燃燒格要連成一條，端點畫成火舌，不然只是一格格方塊。
function drawFire(gs, x, y, t) {
  const cxp = x * TS + TS / 2, cyp = y * TS + TS / 2;
  const a = Math.min(1, t / FIRE_MS * 1.8);
  const lit = (ax, ay) => ax >= 0 && ay >= 0 && ax < W && ay < H && gs.fire[idx(ax, ay)] > 0;
  const L = lit(x - 1, y), R = lit(x + 1, y), U = lit(x, y - 1), D = lit(x, y + 1);
  const w = TS * (.30 + .06 * Math.sin(now() / 55 + x + y));   // 火焰厚度會抖動
  ctx.save();
  ctx.globalAlpha = a;
  const bar = (hx, hy) => {
    const g2 = ctx.createLinearGradient(cxp - hx, cyp - hy, cxp + hx, cyp + hy);
    g2.addColorStop(0, "rgba(255,120,40,.85)"); g2.addColorStop(.5, "#ffe9a8"); g2.addColorStop(1, "rgba(255,120,40,.85)");
    ctx.fillStyle = g2;
    roundRect(cxp - hx, cyp - hy, hx * 2, hy * 2, w * .5); ctx.fill();
  };
  if (L || R) bar(TS * (L && R ? .5 : .5), w);                 // 橫向
  if (U || D) bar(w, TS * .5);
  // 端點的火舌
  const tongue = (dx, dy) => {
    ctx.fillStyle = "rgba(255,150,50,.85)";
    ctx.beginPath();
    ctx.ellipse(cxp + dx * TS * .42, cyp + dy * TS * .42,
      dx ? TS * .14 : w * .95, dy ? TS * .14 : w * .95, 0, 0, 7);
    ctx.fill();
  };
  if (L && !R) tongue(1, 0); if (R && !L) tongue(-1, 0);
  if (U && !D) tongue(0, 1); if (D && !U) tongue(0, -1);
  // 核心
  const g3 = ctx.createRadialGradient(cxp, cyp, 2, cxp, cyp, TS * .46);
  g3.addColorStop(0, "#ffffff"); g3.addColorStop(.35, "#ffe9a8"); g3.addColorStop(1, "rgba(255,110,40,0)");
  ctx.fillStyle = g3;
  ctx.beginPath(); ctx.arc(cxp, cyp, TS * .46, 0, 7); ctx.fill();
  ctx.restore();
}
function draw() {
  const g = S;
  ctx.clearRect(0, 0, VW, VH);
  ctx.fillStyle = "#0d1117"; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.translate(0, TS);
  ctx.fillStyle = "#18242f"; ctx.fillRect(0, 0, VW, H * TS);
  if (!g) { ctx.restore(); return; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawTile(x, y, g.map[idx(x, y)], g);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);
    if (g.coins[i] > 0) {
      ctx.fillStyle = "#ffd23c";
      ctx.beginPath(); ctx.arc(x * TS + TS / 2, y * TS + TS / 2 + Math.sin(now() / 300 + x) * 3, 14, 0, 7); ctx.fill();
      ctx.fillStyle = "#a87a10"; ctx.font = "700 15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("$", x * TS + TS / 2, y * TS + TS / 2 + 1);
    } else if (g.items[i] >= 0) drawItem(x, y, ITEM_KEYS[g.items[i]]);
  }
  for (const b of g.bombs) drawBomb(b);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (g.fire[idx(x, y)] > 0) drawFire(g, x, y, g.fire[idx(x, y)]);
  const order = g.players.slice().sort((a, b) => a.y - b.y);
  for (const p of order) {
    if (!p.alive && !p.cart) continue;
    const s = TS / 96 * .92;
    const px = p.rx !== undefined ? p.rx : p.x, py = p.ry !== undefined ? p.ry : p.y;
    drawBomberman(ctx, p.color, px * TS, py * TS + 6, s, p.dir,
      { dead: !p.alive, blink: p.invuln > 0 && Math.floor(now() / 90) % 2 === 0 });
    if (p.cart) {
      ctx.fillStyle = "rgba(255,255,255,.18)";
      roundRect(px * TS - 30, py * TS + 18, 60, 14, 6); ctx.fill();
    }
    if (p.skull) {
      ctx.fillStyle = "rgba(230,238,245,.9)";
      ctx.beginPath(); ctx.arc(px * TS, py * TS - 74, 11, 0, 7); ctx.fill();
      ctx.fillStyle = "#1a2230";
      ctx.beginPath(); ctx.arc(px * TS - 4, py * TS - 76, 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x * TS + 4, p.y * TS - 76, 3, 0, 7); ctx.fill();
    }
  }
  for (const f of g.fx) {
    const a = f.t / 300;
    ctx.globalAlpha = a * .5;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(f.x * TS + TS / 2, f.y * TS + TS / 2, (1 - a) * TS * 1.6, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ---------- 輸入 ---------- */
const keys = {};
const K1 = { w: [0,-1], a: [-1,0], s: [0,1], d: [1,0] };
const K2 = { arrowup: [0,-1], arrowleft: [-1,0], arrowdown: [0,1], arrowright: [1,0] };
const DIRK = { ...K1, ...K2 };
const twoP = () => OPT.local >= 2;
window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (DIRK[k] || k === " " || k === "j" || k === "k") e.preventDefault();
  if (keys[k]) return;
  keys[k] = 1;
  if (k === " " || k === "j") { myInput.bomb = 1; SEQ.bomb++; }
  if (k === "k") { myInput.skill = 1; SEQ.skill++; }

  if (twoP()) {                       // 第二位玩家：方向鍵 ＋ Enter／／／。
    if (k === "enter" || k === "0") myInput2.bomb = 1;
    if (k === "/") myInput2.skill = 1;

  }
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = 0; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = 0; });
function readFrom(map, out) {
  let dx = 0, dy = 0;
  for (const k in map) if (keys[k]) { dx += map[k][0]; dy += map[k][1]; }
  out.dx = Math.max(-1, Math.min(1, dx));
  out.dy = Math.max(-1, Math.min(1, dy));
}
function readKeys() {
  // 單人時 WASD 與方向鍵都給你用；雙人時拆開，方向鍵讓給第二位玩家
  readFrom(twoP() ? K1 : DIRK, myInput);
  if (twoP()) readFrom(K2, myInput2);
  // 放彈只認「按下的那一下」。
  // 舊版這裡有「按住就連續放」，加上旗標只有在成功放下時才清除，
  // 結果是：炸彈數已滿時按一下，旗標會一直留著，等到有空位就自己補放一顆 ——
  // 玩起來就像角色會自己放炸彈。現在改成每幀結束一律清空，只有 keydown 會點亮。
}
function clearEdge() {
  myInput.bomb = myInput.skill = myInput.det = 0;
  myInput2.bomb = myInput2.skill = myInput2.det = 0;
}
$("pad").querySelectorAll("button").forEach((b) => {
  const d = b.dataset.d;
  const map = { u: [0,-1], d: [0,1], l: [-1,0], r: [1,0], ul: [-1,-1], ur: [1,-1], dl: [-1,1], dr: [1,1], x: [0,0] };
  const on = (e) => { e.preventDefault();
    if (d === "bomb") { myInput.bomb = 1; SEQ.bomb++; }
    else if (d === "skill") { myInput.skill = 1; SEQ.skill++; }

    else if (map[d]) { myInput.padx = map[d][0]; myInput.pady = map[d][1]; } };
  const off = (e) => { e.preventDefault(); if (map[d]) { myInput.padx = 0; myInput.pady = 0; } };
  b.addEventListener("pointerdown", on);
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) => b.addEventListener(t, off));
});

/* ---------- 主迴圈 ---------- */
let last = 0, sideT = 0;
function loop(t) {
  const dt = Math.min(50, t - last || 16); last = t;
  try {
    readKeys();
    if (myInput.padx || myInput.pady) { myInput.dx = myInput.padx; myInput.dy = myInput.pady; }
    pullState();
    if (netMode !== "guest") {
      if (S && !S.over) {
        if (netMode === "host") pullInputs();
        else if (S.players[0]) S.players[0].input = myInput;
      if (twoP() && S.players[1] && !S.players[1].peer) { S.players[1].isAI = false; S.players[1].input = myInput2; }
        stepSim(S, dt);
      }
      syncRender();
      clearEdge();
      pushState(dt);
    } else if (S) {
      // 客端只做時間與火光的視覺推進，狀態以主機快照為準
      S.left = Math.max(0, S.left - dt);
      for (let i = 0; i < W * H; i++) if (S.fire[i] > 0) S.fire[i] = Math.max(0, S.fire[i] - dt);
      if (room) room.presence({ i: [myInput.dx, myInput.dy, SEQ.bomb, SEQ.skill, 0], n: myName() });
      guestSmooth(dt);
      clearEdge();
    }
    draw();
    sideT += dt;
    if (sideT > 200) { sideT = 0; renderSide(); }
  } catch (e) { console.error("[bomber]", e); }
  requestAnimationFrame(loop);
}

/* ---------- 啟動 ---------- */
S = newRound(false);
S.players.forEach((p, i) => (p.isAI = i >= OPT.local));
curtainMenu();
renderSide();
requestAnimationFrame(loop);
initRoom();

window.__b = { S: () => S, OPT, start: startMatch, name: myName, setName: setMyName,
  lobby: () => lobbyList(), room: () => !!room, live: () => matchOn, ws: () => NET.ws,
  diag: () => ({ ...DIAG }), diagText, step: (dt) => stepSim(S, dt),
  input: myInput, W, H, idx, SKULLS, ITEM_KEYS, net: () => netMode, pack: () => packSnapshot(S),
  apply: applySnapshot, newRound: (k) => (S = newRound(k)) };
</script>
